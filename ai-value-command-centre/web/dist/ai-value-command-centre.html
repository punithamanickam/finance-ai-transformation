<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Value Command Centre</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* AI Value Command Centre: enterprise finance UI. Tokens first; components use tokens only. */
:root {
  color-scheme: light;
  --bg: #f4f6f5;
  --surface: #ffffff;
  --surface-2: #eef1f0;
  --ink: #111a19;
  --ink-2: #3e4948;
  --muted: #677371;
  --line: #dde2e0;
  --line-strong: #c5ccca;
  --accent: #1c5cab;
  --accent-soft: #e4edf9;
  --accent-ink: #ffffff;
  --good: #0ca30c; --good-ink: #067a06; --good-soft: #e6f5e6;
  --warn: #fab219; --warn-ink: #8a5a00; --warn-soft: #fdf3dc;
  --crit: #d03b3b; --crit-ink: #b02a2a; --crit-soft: #fbe9e9;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
  --synthetic: #6a4bc4; --synthetic-soft: #efeafb; --public: #0f7a6b; --public-soft: #e3f3f0;
  --shadow: 0 1px 2px rgba(17, 26, 25, .06), 0 4px 16px rgba(17, 26, 25, .05);
  --radius: 8px;
  --font: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f1413; --surface: #171d1c; --surface-2: #1f2625; --ink: #edf1f0; --ink-2: #c3cbc9; --muted: #8e9a98;
    --line: #29312f; --line-strong: #37403e; --accent: #5598e7; --accent-soft: #1b2a3d; --accent-ink: #0b1220;
    --good-ink: #5fd35f; --good-soft: #15291a; --warn-ink: #fab219; --warn-soft: #2e2511; --crit-ink: #f07a7a; --crit-soft: #331819;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --synthetic: #a993f0; --synthetic-soft: #251f38; --public: #4fc7b3; --public-soft: #12302b;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f1413; --surface: #171d1c; --surface-2: #1f2625; --ink: #edf1f0; --ink-2: #c3cbc9; --muted: #8e9a98;
  --line: #29312f; --line-strong: #37403e; --accent: #5598e7; --accent-soft: #1b2a3d; --accent-ink: #0b1220;
  --good-ink: #5fd35f; --good-soft: #15291a; --warn-ink: #fab219; --warn-soft: #2e2511; --crit-ink: #f07a7a; --crit-soft: #331819;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --synthetic: #a993f0; --synthetic-soft: #251f38; --public: #4fc7b3; --public-soft: #12302b;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, td.n, .mono { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 12.5px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100%; }
.rail { background: var(--surface); border-right: 1px solid var(--line); padding: 16px 12px; display: flex; flex-direction: column; gap: 18px;
  position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; }
.brand { display: flex; flex-direction: column; gap: 2px; padding: 4px 8px; }
.brand b { font-size: 15px; letter-spacing: .01em; }
.brand span { color: var(--muted); font-size: 12px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { all: unset; cursor: pointer; display: grid; grid-template-columns: 22px 1fr; align-items: center; padding: 7px 8px; border-radius: 6px; color: var(--ink-2); }
.nav button .k { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.nav button:hover { background: var(--surface-2); }
.nav button.on { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.nav button.on .k { color: var(--accent); }
.nav button:focus-visible { outline: 2px solid var(--accent); }
.rail .foot { margin-top: auto; font-size: 11.5px; color: var(--muted); padding: 0 8px; display: flex; flex-direction: column; gap: 8px; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line); padding-block: 10px; padding-inline: 24px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.topbar h1 { font-size: 17px; font-weight: 600; }
.topbar .q { color: var(--muted); font-size: 13px; }
.topbar .spacer { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; letter-spacing: .02em; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
.chip.syn { background: var(--synthetic-soft); color: var(--synthetic); }
.chip.pub { background: var(--public-soft); color: var(--public); }
.chip.role { background: var(--surface-2); color: var(--ink-2); }
.chip.low, .pill.Low { background: var(--crit-soft); color: var(--crit-ink); }
.page { padding-block: 20px 48px; padding-inline: 24px; display: flex; flex-direction: column; gap: 20px; max-width: 1480px; width: 100%; }
.page-head { display: flex; flex-direction: column; gap: 4px; }
.page-head h2 { font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
.page-head p { margin: 0; color: var(--muted); max-width: 80ch; }

/* ---------- surfaces ---------- */
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-7-5 { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel > header { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.panel > header h3 { font-size: 14.5px; font-weight: 600; }
.panel > header .sub { color: var(--muted); font-size: 12.5px; }
.panel > header .act { margin-left: auto; display: flex; gap: 6px; }
.chart { width: 100%; min-height: 280px; }
.chart.tall { min-height: 360px; }
.chart.short { min-height: 220px; }

/* KPI tiles */
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.kpi .l { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; justify-content: space-between; }
.kpi .v { font-size: 24px; font-weight: 600; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.kpi .d { font-size: 12px; color: var(--ink-2); min-height: 18px; }
.kpi.hl { border-color: var(--line-strong); box-shadow: var(--shadow); }
.explain { all: unset; cursor: pointer; font-size: 11px; font-weight: 600; color: var(--accent); padding: 1px 6px; border-radius: 4px; }
.explain:hover { background: var(--accent-soft); }
.explain:focus-visible { outline: 2px solid var(--accent); }

/* buttons */
.btn { cursor: pointer; border: 1px solid var(--line-strong); background: var(--surface); padding: 6px 12px; border-radius: 6px; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.sm { padding: 3px 8px; font-size: 12.5px; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 4px 10px; cursor: pointer; font-size: 12.5px; }
.seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

/* status */
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.Red, .pill.Critical { background: var(--crit-soft); color: var(--crit-ink); }
.pill.Amber, .pill.Medium { background: var(--warn-soft); color: var(--warn-ink); }
.pill.Green, .pill.High { background: var(--good-soft); color: var(--good-ink); }
.pill.plain { background: var(--surface-2); color: var(--ink-2); }
.pill.plain::before { display: none; }
.flag { font-size: 12px; color: var(--ink-2); }
.flag.Red::before { content: "▲ "; color: var(--crit-ink); }
.flag.Amber::before { content: "● "; color: var(--warn-ink); }

/* tables */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; background: var(--surface-2); position: sticky; top: 0; white-space: nowrap; }
th.n, td.n { text-align: right; white-space: nowrap; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--surface-2); }
tr:last-child td { border-bottom: 0; }
td .bar { height: 6px; border-radius: 3px; background: var(--surface-2); position: relative; min-width: 60px; margin-top: 6px; }
td .bar > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--accent); }
.neg { color: var(--crit-ink); }
.pos { color: var(--good-ink); }
.muted { color: var(--muted); }
.small { font-size: 12px; }

.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.filters select, .filters input { background: var(--surface); border: 1px solid var(--line-strong); border-radius: 6px; padding: 5px 8px; }

/* lists */
.list { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
.list li { display: flex; gap: 10px; align-items: flex-start; }
.list li .ix { font-family: var(--mono); font-size: 11px; color: var(--muted); min-width: 18px; padding-top: 2px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-variant-numeric: tabular-nums; }

/* classification bar */
.stack { display: flex; height: 34px; border-radius: 6px; overflow: hidden; gap: 2px; background: var(--surface); }
.stack > div { display: flex; align-items: center; padding: 0 10px; font-size: 12px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; min-width: 0; }
.stack .r { background: var(--s1); }
.stack .va { background: var(--s3); }
.stack .h { background: repeating-linear-gradient(135deg, var(--surface-2) 0 6px, var(--line-strong) 6px 8px); color: var(--ink); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

/* drawer */
.scrim { position: fixed; inset: 0; background: rgba(8, 12, 12, .35); z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 100%); background: var(--bg); border-left: 1px solid var(--line); z-index: 21;
  display: flex; flex-direction: column; box-shadow: -8px 0 24px rgba(0, 0, 0, .12); padding-top: env(safe-area-inset-top, 0px); }
.drawer > header { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); background: var(--surface); }
.drawer > header h3 { font-size: 15.5px; }
.drawer > header .x { margin-left: auto; }
.drawer .body { overflow-y: auto; padding: 16px 18px 40px; display: flex; flex-direction: column; gap: 16px; }
.section-title { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0; }
.lineage { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12px; }
.lineage span { background: var(--surface); border: 1px solid var(--line); border-radius: 5px; padding: 3px 8px; }
.lineage b { color: var(--muted); font-weight: 400; }
pre.sql { background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; font: 12px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; margin: 0; }

/* copilot */
.copilot { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; align-items: start; }
.thread { display: flex; flex-direction: column; gap: 16px; }
.askbar { display: flex; gap: 8px; position: sticky; bottom: 0; padding: 12px 0; background: var(--bg); }
.askbar input { flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); }
.qbubble { align-self: flex-end; background: var(--accent); color: var(--accent-ink); padding: 8px 12px; border-radius: 10px 10px 2px 10px; max-width: 80%; }
.answer { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.answer .meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }
.answer .lead { font-size: 15px; line-height: 1.6; max-width: 90ch; }
.answer .blk { display: flex; flex-direction: column; gap: 6px; }
.answer ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; }
.numgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
.numgrid .n { border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; display: flex; flex-direction: column; gap: 1px; }
.numgrid .n .lb { font-size: 11.5px; color: var(--muted); }
.numgrid .n .vl { font-weight: 600; font-variant-numeric: tabular-nums; }
.numgrid .n .bs { font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.numgrid .n.assumption .bs, .numgrid .n.forecast .bs, .numgrid .n.validated .bs { color: var(--warn-ink); }
.drill { display: flex; gap: 6px; flex-wrap: wrap; }
.suggest { display: flex; flex-direction: column; gap: 6px; }
.suggest button { all: unset; cursor: pointer; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); font-size: 13px; }
.suggest button:hover { border-color: var(--accent); }
.suggest button:focus-visible { outline: 2px solid var(--accent); }
.ev { border-left: 2px solid var(--line-strong); padding-left: 10px; font-size: 12.5px; display: flex; flex-direction: column; gap: 2px; }
.ev.document, .ev.public_financials { border-color: var(--public); }
.ev q { color: var(--ink-2); font-style: italic; }

/* sliders */
.levers { display: flex; flex-direction: column; gap: 14px; }
.lever { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; }
.lever label { font-size: 13px; }
.lever output { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 13px; }
.lever input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
.compare { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.compare .col { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; background: var(--surface); }
.compare .col.sc { border-color: var(--accent); }

/* report */
.report { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 28px 32px; max-width: 920px; display: flex; flex-direction: column; gap: 18px; }
.report h2 { font-size: 22px; }
.report h4 { font-size: 15px; margin: 0; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.report ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; max-width: 85ch; }

/* login */
.login { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; }
.login .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 28px; width: min(440px, 100%); display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow); }
.login label { font-size: 12.5px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.login input, .login select { padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); }
.err { color: var(--crit-ink); font-size: 13px; }
.banner { font-size: 12.5px; border: 1px dashed var(--synthetic); background: var(--synthetic-soft); color: var(--ink-2); border-radius: 6px; padding: 8px 12px; }

.loading { color: var(--muted); padding: 40px 0; }
.menu-btn { display: none; }

@media (max-width: 1180px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; }
  .rail { position: fixed; z-index: 30; left: 0; top: 0; bottom: 0; width: 250px; transform: translateX(-100%); transition: transform .2s; height: 100%; }
  .rail.open { transform: none; box-shadow: 8px 0 24px rgba(0, 0, 0, .2); }
  .menu-btn { display: inline-flex; }
  .g2, .g3, .g-7-5, .copilot, .compare { grid-template-columns: 1fr; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .topbar, .page { padding-inline: 16px; }
  .report { padding: 20px 16px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

</style>

iece of HPE's strategy, offering a hybrid cloud experience with pay-per-use consumption; 52,000 customers in Q3 FY2026.","source_id":"SRC-09","url":"https://www.sec.gov/Archives/edgar/data/1645590/000164559025000130/hpe-20251031.htm","source_title":"HPE Form 10-K FY2025 \u2014 Item 1 Business: strategy and reportable segments","date":"2025-12-18"},{"product_id":"HPE-OPSRAMP","name":"HPE OpsRamp","category":"HPE GreenLake","public_description":"IT operations management / observability software acquired in 2023 and integrated with HPE GreenLake; an OpsRamp AI copilot was announced as part of Private Cloud AI.","source_id":"SRC-02","url":"https://nvidianews.nvidia.com/news/hpe-nvidia-ai-computing-generative-ai","source_title":"Hewlett Packard Enterprise and NVIDIA Announce 'NVIDIA AI Computing by HPE' to Accelerate Generative AI Industrial Revolution","date":"2024-06-18"},{"product_id":"HPE-PROLIANT","name":"HPE ProLiant servers","category":"AI Infrastructure","public_description":"Compute servers named in the Private Cloud AI infrastructure stack; server revenue sits in HPE's Cloud & AI segment from FY2026.","source_id":"SRC-02","url":"https://nvidianews.nvidia.com/news/hpe-nvidia-ai-computing-generative-ai","source_title":"Hewlett Packard Enterprise and NVIDIA Announce 'NVIDIA AI Computing by HPE' to Accelerate Generative AI Industrial Revolution","date":"2024-06-18"},{"product_id":"HPE-CRAY","name":"HPE Cray supercomputing","category":"AI Infrastructure","public_description":"HPE Cray EX systems powered the three exascale systems on the November 2024 TOP500 list; the 10-K cites supercomputing and direct liquid cooling as AI differentiators.","source_id":"SRC-09","url":"https://www.sec.gov/Archives/edgar/data/1645590/000164559025000130/hpe-20251031.htm","source_title":"HPE Form 10-K FY2025 \u2014 Item 1 Business: strategy and reportable segments","date":"2025-12-18"},{"product_id":"HPE-ALLETRA","name":"HPE Alletra Storage MP","category":"Storage","public_description":"HPE storage platform; over 7,400 Alletra MP arrays shipped by the end of FY2025, and the X10000 achieved NVIDIA-Certified Storage (foundation level) per NVIDIA in June 2026.","source_id":"SRC-07","url":"https://investors.hpe.com/~/media/Files/H/HP-Enterprise-IR/documents/q4-2025/q4-earnings-transcript-final.pdf","source_title":"HPE Q4 FY2025 earnings conference call transcript","date":"2025-12-04"},{"product_id":"HPE-ARUBA","name":"HPE Aruba Networking","category":"Networking","public_description":"HPE's networking portfolio, reported in the Networking segment (FY2025 revenue $6.85B).","source_id":"SRC-09","url":"https://www.sec.gov/Archives/edgar/data/1645590/000164559025000130/hpe-20251031.htm","source_title":"HPE Form 10-K FY2025 \u2014 Item 1 Business: strategy and reportable segments","date":"2025-12-18"},{"product_id":"HPE-JUNIPER","name":"HPE Juniper Networking (Mist AI)","category":"Networking","public_description":"Juniper Networks, acquired on 2 July 2025, doubling HPE's networking business; the DOJ settlement required limited access to Juniper's Mist AI technology.","source_id":"SRC-05","url":"https://www.sec.gov/Archives/edgar/data/1645590/000114036125024519/ef20051378_ex99-1.htm","source_title":"Hewlett Packard Enterprise closes acquisition of Juniper Networks to offer industry-leading comprehensive, cloud-native, AI-driven portfolio","date":"2025-07-02"},{"product_id":"HPE-SERVICES","name":"HPE Services","category":"Services","public_description":"HPE Advisory and Professional Services offer consultative-led services and implementation; HPE Financial Services offers financing to help customers adopt technology including AI.","source_id":"SRC-09","url":"https://www.sec.gov/Archives/edgar/data/1645590/000164559025000130/hpe-20251031.htm","source_title":"HPE Form 10-K FY2025 \u2014 Item 1 Business: strategy and reportable segments","date":"2025-12-18"}],"headline":{"annual":{"total_net_revenue":{"FY2023":29135000000.0,"FY2024":30127000000.0,"FY2025":34296000000.0},"gross_profit":{"FY2023":10239000000.0,"FY2024":9878000000.0,"FY2025":10377000000.0},"earnings_from_operations":{"FY2023":2089000000.0,"FY2024":2190000000.0,"FY2025":-437000000.0},"net_earnings_attributable_to_HPE":{"FY2023":2025000000.0,"FY2024":2579000000.0,"FY2025":57000000.0},"research_and_development":{"FY2023":2349000000.0,"FY2024":2246000000.0,"FY2025":2518000000.0},"net_cash_from_operating_activities":{"FY2023":4428000000.0,"FY2024":4341000000.0,"FY2025":2919000000.0},"free_cash_flow_non_GAAP":{"FY2023":2238000000.0,"FY2024":2297000000.0,"FY2025":986000000.0}},"segments_fy2025":{"Corporate Investments and Other":{"revenue":776000000.0,"operating_profit":-32000000.0},"Financial Services":{"revenue":3504000000.0,"operating_profit":361000000.0},"Hybrid Cloud":{"revenue":5754000000.0,"operating_profit":335000000.0},"Networking":{"revenue":6850000000.0,"operating_profit":1596000000.0},"Server":{"revenue":17745000000.0,"operating_profit":1343000000.0},"Total segments":{"revenue":34629000000.0,"operating_profit":3603000000.0}},"q3_fy2026":{"total_net_revenue":12213000000.0,"gross_profit":4899000000.0,"earnings_from_operations":1393000000.0},"segments_q3_fy2026":{"Cloud & AI":{"revenue":9042000000.0,"operating_profit":1539000000.0},"Corporate Investments and Other":{"revenue":278000000.0,"operating_profit":-67000000.0},"Networking":{"revenue":2893000000.0,"operating_profit":637000000.0}},"ai_facts":[{"id":"AI-01","topic":"AI systems orders","claim":"HPE booked $2.4B of AI systems orders in Q3 FY2026, up over 30% sequentially.","quote":"AI systems orders of $2.4 billion increased over 30% sequentially, reflecting broad-based demand across customer segments.","source_title":"HPE Q3 FY2026 earnings conference call transcript","url":"https://investors.hpe.com/~/media/Files/H/HP-Enterprise-IR/documents/q3-2026/q3-2026-transcript.pdf","date":"2026-09-02"},{"id":"AI-02","topic":"AI systems revenue","claim":"AI systems revenue in Q3 FY2026 was almost $1.6B.","quote":"AI systems revenue for the quarter was almost $1.6 billion. We expect AI systems revenue to improve sequentially in Q4 given timing of backlog conversion.","source_title":"HPE Q3 FY2026 earnings conference call transcript","url":"https://investors.hpe.com/~/media/Files/H/HP-Enterprise-IR/documents/q3-2026/q3-2026-transcript.pdf","date":"2026-09-02"},{"id":"AI-03","topic":"AI backlog","claim":"AI Systems backlog rose to $6.8B exiting Q3 FY2026 (+14% sequentially).","quote":"$2.4B in new AI Systems orders, with backlog increasing to $6.8B","source_title":"HPE Q3 FY2026 earnings presentation (slides)","url":"https://investors.hpe.com/~/media/Files/H/HP-Enterprise-IR/documents/q3-2026/q3-2026-earnings-presentation.pdf","date":"2026-09-02"},{"id":"AI-04","topic":"AI backlog","claim":"Total AI backlog (AI Systems + Networks for AI) was a record $7.6B exiting Q3 FY2026; total AI orders in Q3 were $3.1B and AI YTD orders $6.7B.","quote":"$7.6B AI backlog ... Exiting Q3 FY26 ... $3.1B AI orders booked in Q3 FY26 ... $6.7B AI YTD orders","source_title":"HPE Q3 FY2026 earnings presentation (slides)","url":"https://investors.hpe.com/~/media/Files/H/HP-Enterprise-IR/documents/q3-2026/q3-2026-earnings-presentation.pdf","date":"2026-09-02"},{"id":"AI-05","topic":"AI customer mix","claim":"59% of cumulative AI orders (since Q1 FY23) came from sovereign and enterprise customers as of Q3 FY2026.","quote":"59% Sovereign + enterprise cumulative AI order mix","source_title":"HPE Q3 FY2026 earnings presentation (slides)","url":"https://investors.hpe.com/~/media/Files/H/HP-Enterprise-IR/documents/q3-2026/q3-2026-earnings-presentation.pdf","date":"2026-09-02"},{"id":"AI-06","topic":"Networks for AI","claim":"Networks for AI orders reached $0.7B in Q3 FY2026; cumulative Networks-for-AI orders reached $2.2B and the FY2026 year-end target was raised to $2.5B-$3.0B.","quote":"Cumulative networks for AI orders were $2.2 billion, surpassing our FY 2026 target. As a result, we are increasing our yearend target to $2.5 billion to $3 billion.","source_title":"HPE Q3 FY2026 earnings conference call transcript","url":"https://investors.hpe.com/~/media/Files/H/HP-Enterprise-IR/documents/q3-2026/q3-2026-transcript.pdf","date":"2026-09-02"},{"id":"AI-07","topic":"Hyperscaler inferencing deal","claim":"After Q3 FY2026 quarter end HPE was awarded a $3.5B inferencing server deal with a hyperscaler customer.","quote":"Post Q3, HPE was awarded a $3.5B inferencing deal with hyperscaler customer","source_title":"HPE Q3 FY2026 earnings presentation (slides)","url":"https://investors.hpe.com/~/media/Files/H/HP-Enterprise-IR/documents/q3-2026/q3-2026-earnings-presentation.pdf","date":"2026-09-02"},{"id":"AI-08","topic":"Oracle collaboration","claim":"On Sep 2, 2026 HPE announced expanded collaboration with Oracle; Oracle will deploy HPE Juniper networking routers and switches in AI cloud build-outs. A warrant for up to 4,156,466 HPE shares was issued to Oracle on July 2, 2026 tied to purchase milestones.","quote":"Oracle will deploy HPE Juniper networking routers and switches across one of the largest AI cloud infrastructure build outs.","source_title":"HPE Q3 FY2026 earnings conference call transcript","url":"https://investors.hpe.com/~/media/Files/H/HP-Enterprise-IR/documents/q3-2026/q3-2026-transcript.pdf","date":"2026-09-02"},{"id":"AI-09","topic":"AI systems orders","claim":"In Q2 FY2026 HPE booked $1.8B of new AI systems orders, bringing cumulative AI systems bookings to $16.4B; it entered Q3 with $5.9B of backlog.","quote":"We booked $1.8 billion in new AI systems orders, bringing cumulative AI systems bookings to $16.4 billion. We entered Q3 with $5.9 billion in backlog, primarily composed of enterprise and sovereign orders.","source_title":"HPE Q2 FY2026 earnings conference call transcript","url":"https://investors.hpe.com/~/media/Files/H/HP-Enterprise-IR/documents/q2-2026/q2-2026-transcript.pdf","date":"2026-06-01"},{"id":"AI-10","topic":"AI backlog","claim":"HPE entered Q2 FY2026 with a record AI systems backlog of $5B; Q1 FY2026 AI systems orders were $1.2B, largely enterprise-driven.","quote":"We entered Q2 with a record AI systems backlog of $5 billion, primarily composed of enterprise and sovereign orders, and our sales pipeline remains multiples of our backlog.","source_title":"HPE Q1 FY2026 earnings conference call transcript","url":"https://investors.hpe.com/~/media/Files/H/HP-Enterprise-IR/documents/q1-2026/hpe-q1-26-earnings-transcript.pdf","date":"2026-03-09"},{"id":"AI-11","topic":"AI systems orders","claim":"FY2025 AI server orders totaled $6.8B and cumulative AI orders since Q1 FY2023 reached $13.4B; Q4 FY2025 AI systems orders were $1.9B.","quote":"our AI server business also had good traction with orders totaling $6.8 billion for the fiscal year and cumulative AI orders since Q1 fiscal 2023 reaching $13.4 billion.","source_title":"HPE Q4 FY2025 earnings conference call transcript","url":"https://investors.hpe.com/~/media/Files/H/HP-Enterprise-IR/documents/q4-2025/q4-earnings-transcript-final.pdf","date":"2025-12-04"},{"id":"AI-12","topic":"AI demand risk (10-K)","claim":"HPE's 10-K states AI demand is lumpy and historically concentrated in a small number of large customers and cloud service providers.","quote":"our AI solutions have historically been purchased primarily by a small number of larger customers and cloud service providers. Sales of AI systems to such customers have caused, and may continue to cause, fluctuations in our results of operations","source_title":"HPE Form 10-K for fiscal year ended October 31, 2025","url":"https://www.sec.gov/Archives/edgar/data/1645590/000164559025000130/hpe-20251031.htm","date":"2025-12-18"},{"id":"AI-13","topic":"AI backlog (10-K)","claim":"The FY2025 10-K notes AI systems demand drove significant AI backlog amid data center space constraints and uneven GPU supply.","quote":"AI systems demand in the midst of persisting data center space availability constraints continued to drive significant AI backlog. The supply and demand environment for GPUs continues to remain uneven as the market navigates transition to next generation GPUs.","source_title":"HPE Form 10-K for fiscal year ended October 31, 2025","url":"https://www.sec.gov/Archives/edgar/data/1645590/000164559025000130/hpe-20251031.htm","date":"2025-12-18"},{"id":"AI-14","topic":"AI strategy (10-K)","claim":"HPE's AI infrastructure strategy focuses on sovereign and enterprise customers, leveraging supercomputing heritage and turnkey AI factory solutions including HPE Private Cloud AI.","quote":"In AI infrastructure, HPE is focused on sovereign and enterprise customers, leveraging our supercomputing heritage and turnkey AI factory solutions, including HPE Private Cloud AI and scalable AI servers.","source_title":"HPE Form 10-K for fiscal year ended October 31, 2025","url":"https://www.sec.gov/Archives/edgar/data/1645590/000164559025000130/hpe-20251031.htm","date":"2025-12-18"},{"id":"AI-15","topic":"AI risk factor (10-K)","claim":"HPE flags AI-specific risks: failing to recoup AI investments, flawed algorithms, reputational harm and evolving regulation such as the EU AI Act.","quote":"if our AI-related offerings fail to operate as anticipated or as well as competing offerings or otherwise do not meet customer needs or if we are unable to bring AI-related offerings to market as effectively as our competitors, we may fail to recoup our investments in AI","source_title":"HPE Form 10-K for fiscal year ended October 31, 2025","url":"https://www.sec.gov/Archives/edgar/data/1645590/000164559025000130/hpe-20251031.htm","date":"2025-12-18"},{"id":"AI-16","topic":"Segment realignment","claim":"From FY2026 HPE reports a 'Cloud & AI' segment formed by merging Server, Hybrid Cloud and Financial Services.","quote":"Effective November 1, 2025, HPE implemented an organizational change by (i) merging the Server, Hybrid Cloud, and Financial Services business segments into a new segment named Cloud & Artificial Intelligence (\"AI\")","source_title":"HPE Form 10-Q for quarter ended July 31, 2026","url":"https://www.sec.gov/Archives/edgar/data/1645590/000164559026000080/hpe-20260731.htm","date":"2026-09-03"},{"id":"AI-17","topic":"Cloud & AI segment results","claim":"Cloud & AI revenue was $9.0B in Q3 FY2026, up 25.4% YoY, with 17.0% operating margin (vs 7.0% a year earlier); Server revenue $6.8B (+35.3%).","quote":"Cloud & AI revenue was $9.0 billion, up 25.4% from the prior-year period, with 17.0% operating profit margin, compared to 7.0% from the prior-year period.","source_title":"HPE reports fiscal 2026 third quarter results (8-K Ex. 99.1)","url":"https://www.sec.gov/Archives/edgar/data/1645590/000164559026000078/ex-991x922026x8k.htm","date":"2026-09-02"},{"id":"AI-18","topic":"Server pricing / memory supply","claim":"Q3 FY2026 server revenue growth was driven mainly by higher average selling prices from memory and SSD commodity price increases; HPE cites a worldwide memory shortage linked to AI data center expansion.","quote":"The increase in average selling price was primarily driven by commodity price increases, especially memory and SSDs.","source_title":"HPE Form 10-Q for quarter ended July 31, 2026","url":"https://www.sec.gov/Archives/edgar/data/1645590/000164559026000080/hpe-20260731.htm","date":"2026-09-03"},{"id":"AI-19","topic":"HPE Private Cloud AI - launch","claim":"HPE Private Cloud AI was announced June 18, 2024 at HPE Discover as the key offering of 'NVIDIA AI Computing by HPE', co-developed with NVIDIA.","quote":"Among the portfolio's key offerings is HPE Private Cloud AI, a first-of-its-kind solution that provides the deepest integration to date of NVIDIA AI computing, networking and software with HPE's AI storage, compute and the HPE GreenLake cloud.","source_title":"Hewlett Packard Enterprise and NVIDIA Announce 'NVIDIA AI Computing by HPE' to Accelerate Generative AI Industrial Revolution (NVIDIA Newsroom joint release)","url":"https://nvidianews.nvidia.com/news/hpe-nvidia-ai-computing-generative-ai","date":"2024-06-18"},{"id":"AI-20","topic":"HPE Private Cloud AI - stack","claim":"Private Cloud AI's software foundation is NVIDIA AI Enterprise (incl. NIM microservices) plus HPE AI Essentials; infrastructure includes NVIDIA Spectrum-X Ethernet, HPE GreenLake for File Storage and HPE ProLiant servers; offered in four right-sized configurations.","quote":"HPE Private Cloud AI delivers a fully integrated AI infrastructure stack that includes NVIDIA Spectrum-X Ethernet networking, HPE GreenLake for File Storage and HPE ProLiant servers with support for NVIDIA L40S, NVIDIA H100 NVL Tensor Core GPUs and the NVIDIA GH200 NVL2 platform.","source_title":"Hewlett Packard Enterprise and NVIDIA Announce 'NVIDIA AI Computing by HPE' to Accelerate Generative AI Industrial Revolution (NVIDIA Newsroom joint release)","url":"https://nvidianews.nvidia.com/news/hpe-nvidia-ai-computing-generative-ai","date":"2024-06-18"},{"id":"AI-21","topic":"NVIDIA partnership / GTM","claim":"NVIDIA AI Computing by HPE is sold via a joint go-to-market including system integrators Deloitte, HCLTech, Infosys, TCS and Wipro.","quote":"All NVIDIA AI Computing by HPE offerings and services will be available through a joint go-to-market strategy that spans sales teams and channel partners, training and a global network of system integrators \u2014 including Deloitte, HCLTech, Infosys, TCS and Wipro","source_title":"Hewlett Packard Enterprise and NVIDIA Announce 'NVIDIA AI Computing by HPE' to Accelerate Generative AI Industrial Revolution (NVIDIA Newsroom joint release)","url":"https://nvidianews.nvidia.com/news/hpe-nvidia-ai-computing-generative-ai","date":"2024-06-18"},{"id":"AI-22","topic":"HPE OpsRamp","claim":"OpsRamp (acquired May 2, 2023 for ~$307M fair value consideration) provides observability/AIOps integrated with GreenLake; an OpsRamp AI copilot powers Private Cloud AI operations.","quote":"OpsRamp now provides observability for the end-to-end NVIDIA accelerated computing stack, including NVIDIA NIM and AI software, NVIDIA Tensor Core GPUs and AI clusters as well as NVIDIA Quantum InfiniBand and NVIDIA Spectrum Ethernet switches.","source_title":"Hewlett Packard Enterprise and NVIDIA Announce 'NVIDIA AI Computing by HPE' to Accelerate Generative AI Industrial Revolution (NVIDIA Newsroom joint release)","url":"https://nvidianews.nvidia.com/news/hpe-nvidia-ai-computing-generative-ai","date":"2024-06-18"},{"id":"AI-23","topic":"HPE Private Cloud AI - 2026 expansion","claim":"At HPE Discover Las Vegas (June 2026) HPE and NVIDIA expanded the HPE AI Factory with NVIDIA, including NVIDIA Vera CPU (DL394 Gen12, available 2027) and NVIDIA Agent Toolkit for HPE Private Cloud AI.","quote":"The HPE ProLiant Compute DL394 Gen12 with the NVIDIA Vera CPU will be available in 2027 with HPE Private Cloud AI, a turnkey AI factory co-engineered with NVIDIA.","source_title":"HPE AI Factory With NVIDIA Expands for the Era of Agents (NVIDIA Blog)","url":"https://blogs.nvidia.com/blog/hpe-ai-factory-agentic-enterprise/","date":"2026-06-16"},{"id":"AI-24","topic":"HPE Private Cloud AI - traction","claim":"Private Cloud AI orders rose triple digits YoY in Q3 FY2026; HPE claims (internal analysis) up to 60% lower token cost vs public cloud.","quote":"PCAI orders increased triple-digits in Q3 as customers are adopting our AI factory platform to support agentic AI and inferencing initiatives.","source_title":"HPE Q3 FY2026 earnings conference call transcript","url":"https://investors.hpe.com/~/media/Files/H/HP-Enterprise-IR/documents/q3-2026/q3-2026-transcript.pdf","date":"2026-09-02"},{"id":"AI-25","topic":"HPE Private Cloud AI - customers","claim":"HPE closed FY2025 with approximately 100 new Private Cloud AI logos; PCAI orders more than doubled sequentially in Q4 FY2025.","quote":"We are also seeing good growth in private cloud AI orders, which more than doubled sequentially, and we closed the year with approximately 100 new logos in this space.","source_title":"HPE Q4 FY2025 earnings conference call transcript","url":"https://investors.hpe.com/~/media/Files/H/HP-Enterprise-IR/documents/q4-2025/q4-earnings-transcript-final.pdf","date":"2025-12-04"},{"id":"AI-26","topic":"HPE Private Cloud AI - definition","claim":"HPE's developer portal describes Private Cloud AI as a purpose-built, HPE/NVIDIA co-developed solution focused on inferencing, RAG and fine-tuning, managed through HPE GreenLake.","quote":"HPE Private Cloud AI is a purpose-built solution designed to provide fast and easy deployment of private AI applications with a focus on inferencing, Retrieval-Augmented Generation (RAG), and fine-tuning.","source_title":"HPE Private Cloud AI | HPE Developer Portal","url":"https://developer.hpe.com/platform/hpe-private-cloud-ai/home/","date":"accessed 2026-09-25"},{"id":"AI-27","topic":"GreenLake customers","claim":"GreenLake customer count grew 18% to 52,000 in Q3 FY2026 from 44,000 a year earlier.","quote":"In Q3, the number of GreenLake customers grew 18% to 52,000 up from 44,000 a year ago.","source_title":"HPE Q3 FY2026 earnings conference call transcript","url":"https://investors.hpe.com/~/media/Files/H/HP-Enterprise-IR/documents/q3-2026/q3-2026-transcript.pdf","date":"2026-09-02"},{"id":"AI-28","topic":"ARR","claim":"HPE's ARR was $3.151B at FY2025 year-end, up 63% YoY (from $1.938B), mainly due to Juniper.","quote":"The 63% year over year increase in ARR was primarily due to growth in the Networking segment due to the Merger and an expanding customer installed base.","source_title":"HPE Form 10-K for fiscal year ended October 31, 2025","url":"https://www.sec.gov/Archives/edgar/data/1645590/000164559025000130/hpe-20251031.htm","date":"2025-12-18"},{"id":"AI-29","topic":"GreenLake (10-K)","claim":"The 10-K describes HPE GreenLake cloud as a centerpiece of HPE's strategy, offering a hybrid experience with pay-per-use consumption.","quote":"The HPE GreenLake cloud is designed to deliver a seamless hybrid experience with true pay-per-use consumption and automated scalability.","source_title":"HPE Form 10-K for fiscal year ended October 31, 2025","url":"https://www.sec.gov/Archives/edgar/data/1645590/000164559025000130/hpe-20251031.htm","date":"2025-12-18"},{"id":"AI-30","topic":"Juniper acquisition - announcement","claim":"HPE agreed on Jan 9, 2024 to acquire Juniper Networks for $40.00 per share in cash, an equity value of ~$14B.","quote":"HPE will acquire Juniper in an all-cash transaction for $40.00 per share, representing an equity value of approximately $14 billion.","source_title":"HPE to Acquire Juniper Networks to Accelerate AI-Driven Innovation (8-K Ex. 99.1)","url":"https://www.sec.gov/Archives/edgar/data/1645590/000114036124001613/ny20018436x1_ex99-1.htm","date":"2024-01-09"},{"id":"AI-31","topic":"Juniper acquisition - close","claim":"HPE completed the Juniper Networks acquisition on July 2, 2025; the transaction doubles HPE's networking business.","quote":"HOUSTON \u2013 July 2, 2025 \u2013 HPE (NYSE: HPE) today announced the successful completion of its previously announced acquisition of Juniper Networks, Inc., a leader in AI-native networks.","source_title":"Hewlett Packard Enterprise closes acquisition of Juniper Networks (8-K Ex. 99.1)","url":"https://www.sec.gov/Archives/edgar/data/1645590/000114036125024519/ef20051378_ex99-1.htm","date":"2025-07-02"},{"id":"AI-32","topic":"Juniper - DOJ settlement / Mist AI","claim":"The June 28, 2025 DOJ settlement required HPE to divest its Instant On business and facilitate limited access to Juniper's Mist AIOps technology.","quote":"As part of the settlement, HPE has agreed to divest its global Instant On campus and branch business. After close, HPE will facilitate limited access to Juniper's advanced Mist AIOps technology.","source_title":"HPE and Juniper Networks reach settlement with U.S. Department of Justice (8-K Ex. 99.2)","url":"https://www.sec.gov/Archives/ed <script>
/* Browser port of src/scenario/engine.py `run()`. Same formulas, same inputs; tests/test_scenario.py checks parity via node. */
(function (root) {
  const LEVERS = ["additional_investment", "utilisation_target", "cloud_cost_change", "productivity_change", "revenue_uplift_change",
    "adoption_change", "benefit_realisation", "project_delay_months", "implementation_cost_change"];
  const DEFAULTS = { additional_investment: 0, cloud_cost_change: 0, productivity_change: 0, revenue_uplift_change: 0, adoption_change: 0,
    benefit_realisation: 1, project_delay_months: 0, implementation_cost_change: 0 };

  function roi(v, i) { return i === 0 ? null : (v - i) / i; }

  function run(base, levers, A) {
    const lv = Object.assign({}, DEFAULTS, { utilisation_target: base.utilisation });
    for (const k of LEVERS) if (levers && levers[k] !== undefined && levers[k] !== null) lv[k] = Number(levers[k]);
    const bridge = [];
    const add = (lever, label, dv, dc, note) => {
      dv = dv || 0; dc = dc || 0;
      if (Math.abs(dv) > 0.005 || Math.abs(dc) > 0.005) bridge.push({ lever, label, value_change: dv, cost_change: dc, note: note || "" });
    };
    add("additional_investment", "Additional investment in proven use cases",
      lv.additional_investment * base.top_performer_value_per_dollar * A["A-35"], lv.additional_investment);
    const dUtil = lv.utilisation_target - base.utilisation;
    const dHours = base.capacity_gpu_hours_annual * dUtil;
    if (Math.abs(dUtil) > 1e-9) {
      add("utilisation_target", "Infrastructure utilisation (new workloads on existing capacity)",
        dHours * base.value_per_used_gpu_hour * A["A-33"], dHours * (base.non_infra_investment_per_used_gpu_hour * A["A-36"] + A["A-34"]));
    }
    add("cloud_cost_change", "Cloud cost", 0, base.cloud_spend * lv.cloud_cost_change);
    add("productivity_change", "Employee productivity", base.expected_productivity * lv.productivity_change, 0);
    add("revenue_uplift_change", "Revenue uplift", base.expected_revenue * lv.revenue_uplift_change, 0);
    add("adoption_change", "AI adoption (productivity benefits)", base.expected_productivity * lv.adoption_change, 0);
    add("implementation_cost_change", "Implementation cost", 0, base.investment * lv.implementation_cost_change);
    add("project_delay_months", "Project delay (in-flight initiatives)", -base.in_flight_expected_value * lv.project_delay_months * A["A-37"], 0);
    const gross = base.expected_benefit + bridge.reduce((s, b) => s + b.value_change, 0);
    add("benefit_realisation", "Benefit realisation rate", gross * (lv.benefit_realisation - 1), 0);
    const dV = bridge.reduce((s, b) => s + b.value_change, 0);
    const dC = bridge.reduce((s, b) => s + b.cost_change, 0);
    const sInv = base.investment + dC, sVal = base.expected_value + dV, monthly = dV / 12;
    return {
      levers: lv,
      base: { investment: base.investment, expected_value: base.expected_value, net_value: base.expected_value - base.investment,
        roi: roi(base.expected_value, base.investment), utilisation: base.utilisation },
      scenario: { investment: sInv, expected_value: sVal, net_value: sVal - sInv, roi: roi(sVal, sInv), utilisation: lv.utilisation_target },
      incremental: { cost: dC, value: dV, net_value: dV - dC, roi: dC > 0 ? roi(dV, dC) : null, capacity_gpu_hours: dHours,
        infrastructure_avoided: Math.max(dHours, 0) * base.infra_cost_per_capacity_gpu_hour,
        payback_months: dC > 0 && monthly > 0 ? dC / monthly : null },
      bridge,
      label: "ILLUSTRATIVE scenario on SYNTHETIC data - not a forecast",
    };
  }

  function sensitivity(base, A, swing) {
    swing = swing === undefined ? 0.2 : swing;
    const ref = run(base, {}, A).scenario.net_value;
    const tests = [
      ["utilisation_target", "Infrastructure utilisation (+/-10pp)", base.utilisation - 0.1, base.utilisation + 0.1],
      ["adoption_change", "AI adoption", -swing, swing], ["revenue_uplift_change", "Revenue uplift", -swing, swing],
      ["productivity_change", "Productivity improvement", -swing, swing], ["cloud_cost_change", "Cloud cost", swing, -swing],

          ${meta.baseline.assumptions.map(a => `<tr><td class="mono">${esc(a.assumption_id)}</td><td>${esc(a.description)}</td><td class="n">${num(a.value, 3)}</td><td class="small">${esc(a.source)}</td></tr>`).join("")}
          <tr><td class="mono">base</td><td>Value per used GPU-hour (Q4 run-rate)</td><td class="n">$${num(meta.base.value_per_used_gpu_hour, 2)}</td><td class="small">derived from benefit and GPU telemetry</td></tr>
          <tr><td class="mono">base</td><td>Non-infrastructure investment per used GPU-hour</td><td class="n">$${num(meta.base.non_infra_investment_per_used_gpu_hour, 2)}</td><td class="small">derived from programme spend</td></tr>
          <tr><td class="mono">base</td><td>Current GPU utilisation (FY26-Q4)</td><td class="n">${pct(meta.base.utilisation, 1)}</td><td class="small">infrastructure_usage</td></tr>
        </tbody></table></div></section>
      </div>`;
    let timer = null;
    const update = async () => {
      Object.keys(L).forEach(k => { $("#o_" + k).textContent = show(k, val(k)); });
      let r;
      const levers = Object.fromEntries(Object.keys(L).filter(k => S.levers[k] !== undefined).map(k => [k, S.levers[k]]));
      try { r = SNAP ? window.AVCCScenario.run(meta.base, levers, meta.assumptions) : await post("/scenario/run", { levers }); }
      catch (err) { $("#cmp").innerHTML = `<p class="err">${esc(err.message)}</p>`; return; }
      const b = r.base, s = r.scenario, inc = r.incremental;
      $("#cmp").innerHTML = `
        <div class="col"><p class="section-title">Base case (FY2026)</p><dl class="kv"><dt>Investment</dt><dd>${money(b.investment)}</dd><dt>Expected value</dt><dd>${money(b.expected_value)}</dd><dt>Net value</dt><dd>${money(b.net_value)}</dd><dt>ROI</dt><dd>${pct(b.roi, 1)}</dd><dt>Utilisation</dt><dd>${pct(b.utilisation, 1)}</dd></dl></div>
        <div class="col sc"><p class="section-title">Scenario</p><dl class="kv"><dt>Investment</dt><dd>${money(s.investment)}</dd><dt>Expected value</dt><dd>${money(s.expected_value)}</dd><dt>Net value</dt><dd class="${cls(s.net_value)}">${money(s.net_value)}</dd><dt>ROI</dt><dd>${pct(s.roi, 1)}</dd><dt>Utilisation</dt><dd>${pct(s.utilisation, 1)}</dd></dl></div>
        <div class="col" style="grid-column:1/-1"><p class="section-title">Incremental</p><dl class="kv" style="grid-template-columns:repeat(4,max-content 1fr)">
          <dt>Cost</dt><dd>${money(inc.cost)}</dd><dt>Expected benefit</dt><dd>${money(inc.value)}</dd><dt>Net value</dt><dd class="${cls(inc.net_value)}">${money(inc.net_value)}</dd><dt>Incremental ROI</dt><dd>${inc.roi === null ? "n/a" : pct(inc.roi)}</dd>
          <dt>Capacity</dt><dd>${num(inc.capacity_gpu_hours)} GPU-h</dd><dt>Infra avoided</dt><dd>${money(inc.infrastructure_avoided)}</dd><dt>Payback</dt><dd>${inc.payback_months ? num(inc.payback_months, 1) + " mo" : "n/a"}</dd><dt></dt><dd></dd></dl></div>`;
      const c = series(), br = r.bridge;
      if (!br.length) { $("#c_br").innerHTML = '<p class="muted small">Move a lever or pick a preset to see the bridge.</p>'; $("#br_notes").innerHTML = ""; return; }
      $("#c_br").innerHTML = "";
      plot($("#c_br"), [{ type: "bar", name: "Value change", x: br.map(x => x.label), y: br.map(x => M(x.value_change)), marker: { color: c[0] }, hovertemplate: "%{x}<br>Value %{y:.2f}M<extra></extra>" },
        { type: "bar", name: "Cost change", x: br.map(x => x.label), y: br.map(x => M(x.cost_change)), marker: { color: c[1] }, hovertemplate: "%{x}<br>Cost %{y:.2f}M<extra></extra>" }],
        { barmode: "group", yaxis: { title: { text: "$M" } }, margin: { b: 70 } });
      $("#br_notes").innerHTML = br.filter(x => x.note).map(x => `${esc(x.label)}: ${esc(x.note)}`).join("<br>");
    };
    el.querySelectorAll("input[type=range]").forEach(inp => inp.oninput = () => { S.levers[inp.dataset.k] = Number(inp.value); clearTimeout(timer); timer = setTimeout(update, SNAP ? 0 : 150); Object.keys(L).forEach(k => { $("#o_" + k).textContent = show(k, val(k)); }); });
    el.querySelectorAll("[data-preset]").forEach(b => b.onclick = () => { S.levers = {}; if (b.dataset.preset) b.dataset.preset.split("&").forEach(kv => { const [k, v] = kv.split("="); S.levers[k] = Number(v); }); go("scenario"); });
    update();
    const t = [...meta.sensitivity].reverse(), c = series();
    plot($("#c_tor"), [{ type: "bar", orientation: "h", name: "Downside", y: t.map(x => x.label), x: t.map(x => M(Math.min(x.low, x.high))), marker: { color: c[1] }, hovertemplate: "%{y}<br>%{x:.2f}M<extra></extra>" },
      { type: "bar", orientation: "h", name: "Upside", y: t.map(x => x.label), x: t.map(x => M(Math.max(x.low, x.high))), marker: { color: c[0] }, hovertemplate: "%{y}<br>+%{x:.2f}M<extra></extra>" }],
      { barmode: "overlay", xaxis: { title: { text: "change in net value ($M)" } }, margin: { l: 10, b: 80 }, legend: { y: -0.32 } });
  };

  RENDER.evidence = async el => {
    const [src, d] = await Promise.all([get("/sources"), get("/dashboard")]);
    const kpiIds = [["kpi.total_investment", "Total AI investment"], ["kpi.realised_value", "Realised AI value"], ["kpi.expected_value", "Expected AI value"], ["kpi.value_classification", "Realised / validated / hypothetical"],
      ["kpi.realised_roi", "Realised ROI"], ["kpi.expected_roi", "Expected ROI"], ["kpi.benefit_realisation", "Benefit realisation"], ["kpi.net_value", "Net AI value"], ["kpi.ai_cost_growth_qoq", "AI cost growth"], ["kpi.at_risk", "At-risk initiatives"], ["analysis.roi_movement", "ROI movement"]];
    const h = src.headline || {}, a = h.annual || {};
    const fy = ["FY2023", "FY2024", "FY2025"];
    const rowsFin = [["Total net revenue", "total_net_revenue"], ["Gross profit", "gross_profit"], ["Earnings from operations", "earnings_from_operations"], ["Net earnings", "net_earnings_attributable_to_HPE"], ["R&D", "research_and_development"], ["Operating cash flow", "net_cash_from_operating_activities"], ["Free cash flow (non-GAAP)", "free_cash_flow_non_GAAP"]];
    el.innerHTML = `
      <section class="panel"><header><h3>How every number is produced</h3><span class="sub">data lineage</span></header>
        <div class="lineage"><span>Public HPE sources (SEC filings, IR, partner releases)</span><b>+</b><span>Synthetic enterprise transactions</span><b>→</b><span>Relational data model (24 tables)</span><b>→</b><span>Deterministic finance engines</span><b>→</b><span>Evidence record (formula, components, datasets, SQL)</span><b>→</b><span>Copilot answer</span><b>→</b><span>Audit log + SHA-256</span></div>
        <p class="small muted" style="margin:0">Every headline figure below has an evidence record. Each copilot answer is logged with its question, intent, agent, evidence ids, SQL and a hash of the response, so it can be reproduced from the same data.</p></section>
      <div class="grid g2">
        <section class="panel"><header><h3>Explain a headline number</h3></header><ul class="list">${kpiIds.map(([id, l]) => `<li><span class="mono ix">›</span><div>${esc(l)} ${explain(id)}</div></li>`).join("")}</ul></section>
        <section class="panel"><header><h3>HPE public financial context</h3><span class="chip pub">PUBLIC</span><span class="sub">$M, fiscal years to 31 Oct, from HPE's FY2025 Form 10-K</span></header>
          <div class="tbl-wrap"><table><thead><tr><th>Metric</th>${fy.map(y => `<th class="n">${y}</th>`).join("")}</tr></thead><tbody>
            ${rowsFin.map(([l, m]) => `<tr><td>${l}</td>${fy.map(y => `<td class="n ${cls((a[m] || {})[y])}">${(a[m] || {})[y] === undefined || (a[m] || {})[y] === null ? "n/a" : num((a[m] || {})[y] / 1e6)}</td>`).join("")}</tr>`).join("")}
          </tbody></table></div>
          <p class="section-title">Latest quarter: Q3 FY2026 segments</p>
          <div class="tbl-wrap"><table><thead><tr><th>Segment</th><th class="n">Revenue $M</th><th class="n">Operating profit $M</th><th class="n">Margin</th></tr></thead><tbody>
            ${Object.entries(h.segments_q3_fy2026 || {}).map(([s, v]) => `<tr><td>${esc(s)}</td><td class="n">${num(v.revenue / 1e6)}</td><td class="n ${cls(v.operating_profit)}">${num(v.operating_profit / 1e6)}</td><td class="n">${v.revenue ? pct(v.operating_profit / v.revenue, 1) : ""}</td></tr>`).join("")}
          </tbody></table></div></section>
      </div>
      <section class="panel"><header><h3>HPE AI facts</h3><span class="chip pub">PUBLIC</span><span class="sub">verbatim quotes from cited sources; order and backlog figures are company-reported KPIs</span></header>
        <div class="tbl-wrap"><table><thead><tr><th>ID</th><th>Topic</th><th>Fact</th><th>Quote</th><th>Source</th></tr></thead><tbody>
          ${(h.ai_facts || []).map(f => `<tr><td class="mono">${esc(f.id)}</td><td class="small">${esc(f.topic)}</td><td>${esc(f.claim)}</td><td class="small"><q>${esc(f.quote)}</q></td><td class="small"><a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.source_title)}</a><div class="muted">${esc(f.date)}</div></td></tr>`).join("")}
        </tbody></table></div></section>
      <section class="panel"><header><h3>Source registry</h3><span class="sub">${src.sources.length} public sources used by the RAG corpus, product mapping and financial context</span></header>
        <div class="tbl-wrap"><table><thead><tr><th>ID</th><th>Title</th><th>Publisher</th><th>Type</th><th>Date</th></tr></thead><tbody>
          ${src.sources.map(s => `<tr><td class="mono">${esc(s.source_id)}</td><td><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a></td><td class="small">${esc(s.publisher)}</td><td class="small">${esc(s.source_type)}</td><td class="mono">${esc(s.date)}</td></tr>`).join("")}
        </tbody></table></div></section>
      <section class="panel" id="auditp"><header><h3>Audit log</h3><span class="sub">CFO role only</span></header><div id="audit" class="small muted">Loading…</div></section>`;
    try {
      const log = await get("/audit");
      $("#audit").innerHTML = `<div class="tbl-wrap"><table><thead><tr><th>#</th><th>Time (UTC)</th><th>User</th><th>Role</th><th>Action</th><th>Detail</th><th>Response SHA-256</th></tr></thead><tbody>
        ${log.slice(0, 40).map(x => `<tr><td class="mono">${x.id}</td><td class="mono">${esc(x.timestamp)}</td><td class="small">${esc(x.user_id)}</td><td>${esc(x.role)}</td><td class="mono">${esc(x.action)}</td><td class="small">${esc(x.detail && x.detail.question ? x.detail.question + " → " + x.detail.intent : JSON.stringify(x.detail).slice(0, 120))}</td><td class="mono small">${esc((x.result_sha256 || "").slice(0, 16))}</td></tr>`).join("")}</tbody></table></div>`;
    } catch (err) { $("#audit").textContent = err.message.includes("lacks") ? "Your role cannot view the audit log." : err.message; }
  };

  RENDER.report = async (el, arg) => {
    el.innerHTML = `<div class="filters"><button class="btn primary" id="gen">Generate CFO Briefing</button><span class="muted small">Assembled from engine outputs. Neutral language; decisions rest with management.</span></div><div id="rep"></div>`;
    const gen = async () => {
      $("#rep").innerHTML = '<div class="loading">Generating…</div>';
      try {
        const b = await post("/reports/cfo", { format: "json" });
        const k = b.kpis;
        $("#rep").innerHTML = `<article class="report"><div><p class="section-title">Board / CFO briefing · ${esc(b.scope)}</p><h2>${esc(b.title)}</h2><p class="muted small">${esc(b.subtitle)} · generated ${esc(b.generated)}</p></div>
          <div class="banner">${esc(b.disclaimer)}</div>
          <div class="kpis">${[["Investment", money(k.total_investment)], ["Realised value", money(k.realised_value)], ["Expected value", money(k.expected_value)], ["Realised ROI", pct(k.realised_roi)], ["At-risk initiatives", k.at_risk]].map(t => `<div class="kpi"><div class="l">${t[0]}</div><div class="v">${t[1]}</div></div>`).join("")}</div>
          ${b.sections.map(s => `<section><h4>${esc(s.heading)}</h4><ul>${s.points.map(p => `<li>${esc(p)}</li>`).join("")}</ul></section>`).join("")}
          <div class="filters"><button class="btn sm" id="copymd">Copy as Markdown</button><span id="copied" class="muted small"></span></div></article>`;
        $("#copymd").onclick = async () => {
          const md = `# ${b.title}\n*${b.subtitle}*\n\n> ${b.disclaimer}\n\n` + b.sections.map(s => `## ${s.heading}\n` + s.points.map(p => `- ${p}`).join("\n")).join("\n\n");
          try { await navigator.clipboard.writeText(md); $("#copied").textContent = "Copied"; } catch (e) { $("#copied").textContent = "Copy is blocked here; select the text instead."; }
        };
      } catch (err) { $("#rep").innerHTML = `<p class="err">${esc(err.message)}</p>`; }
    };
    $("#gen").onclick = gen;
    if (arg === "generate" || SNAP) gen();
  };

  /* ------------------------------------------------------------ auth + boot */
  function logout() { store.set("avcc_token", null); store.set("avcc_user", null); S.token = null; location.hash = ""; loginView(); }
  async function loginView(msg) {
    let users = [];
    try { users = await (await fetch("/auth/demo-users")).json(); } catch (e) { /* offline */ }
    $("#app").innerHTML = `<div class="login"><form class="card" id="lf">
      <div><b style="font-size:18px">AI Value Command Centre</b><div class="muted small">Are we actually getting value from AI?</div></div>
      <div class="banner">Portfolio prototype. Public HPE information plus clearly labelled SYNTHETIC data for a fictional enterprise. Nothing here is HPE internal data.</div>
      <label for="lu">Demo user<select id="lu">${users.map(u => `<option value="${esc(u.user_id)}">${esc(u.display_name)} (${esc(u.role)}${u.bu_id ? ", " + esc(u.bu_id) : ""})</option>`).join("")}</select></label>
      <label for="lp">Password<input id="lp" type="password" value="" autocomplete="current-password" placeholder="demo password (AVCC_DEMO_PASSWORD)"></label>
      ${msg ? `<div class="err">${esc(msg)}</div>` : ""}
      <button class="btn primary" type="submit">Sign in</button>
      <div class="muted small">Roles: CFO sees everything including the audit log; Finance sees the whole portfolio; a business-unit leader sees only their unit.</div></form></div>`;
    $("#lf").onsubmit = async e => {
      e.preventDefault();
      const r = await fetch("/auth/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ user_id: $("#lu").value, password: $("#lp").value }) });
      if (!r.ok) return loginView("Sign-in failed: check the password.");
      const j = await r.json(); S.token = j.token; S.user = j.user; store.set("avcc_token", j.token); store.set("avcc_user", JSON.stringify(j.user));
      for (const k in cache) delete cache[k];
      S.meta = null; S.thread = []; boot();
    };
  }
  function boot() {
    shell();
    const h = (location.hash || "").replace("#", "");
    go(PAGES.some(p => p[0] === h) ? h : "command");
  }
  // re-theme charts when the viewer's theme changes
  const rerender = () => { if (S.user && $("#page")) go(S.page); };
  try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", rerender); } catch (e) { /* old browsers */ }
  new MutationObserver(rerender).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  if (SNAP) { S.user = SNAP.user; boot(); }
  else {
    S.token = store.get("avcc_token");
    try { S.user = JSON.parse(store.get("avcc_user") || "null"); } catch (e) { S.user = null; }
    if (S.token && S.user) boot(); else loginView();
  }
})();

</script>

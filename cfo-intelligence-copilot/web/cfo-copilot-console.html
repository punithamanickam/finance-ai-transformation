<style>
:root{
  --bg:#f3f5f7; --panel:#ffffff; --panel-2:#f8fafb; --ink:#122033; --muted:#5a6675; --faint:#8a95a3; --line:#dde3e9;
  --accent:#0e6e78; --accent-ink:#ffffff; --accent-soft:#e2f0f1;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --neutral:#8a8985;

  --shadow:0 1px 2px rgba(18,32,51,.06),0 2px 8px rgba(18,32,51,.04);
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0d131a; --panel:#141c26; --panel-2:#18222d; --ink:#e4eaf1; --muted:#9ba7b5; --faint:#6f7b89; --line:#253240;
    --accent:#45b4bd; --accent-ink:#06282b; --accent-soft:#15343a;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --neutral:#8d8c86;
    --good:#43b381; --bad:#e66767; --warn:#d8a53b; --warn-soft:#2d2512;
    --b-fact:#5b9ceb; --b-calc:#3cbf8f; --b-interp:#d8a53b; --b-mgmt:#e8804f;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0d131a; --panel:#141c26; --panel-2:#18222d; --ink:#e4eaf1; --muted:#9ba7b5; --faint:#6f7b89; --line:#253240;
  --accent:#45b4bd; --accent-ink:#06282b; --accent-soft:#15343a;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --neutral:#8d8c86;
  --good:#43b381; --bad:#e66767; --warn:#d8a53b; --warn-soft:#2d2512;
  --b-fact:#5b9ceb; --b-calc:#3cbf8f; --b-interp:#d8a53b; --b-mgmt:#e8804f;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;margin:0;padding-inline:16px;padding-block:0 40px}
.wrap{max-width:1220px;margin:0 auto}
h1,h2,h3{font-family:var(--serif);font-weight:600;text-wrap:balance;margin:0;letter-spacing:-.005em}
h2{font-size:1.45rem} h3{font-size:1.08rem}
.num,td.n,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .small{font-size:.8rem}

/* header */
header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;padding-block:22px 14px;border-bottom:1px solid var(--line)}
.brand h1{font-size:1.7rem}
.brand .sub{color:var(--muted);font-size:.86rem;margin-top:2px}
.filing{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px;font-size:.78rem;white-space:nowrap}
.chip b{font-weight:600}
.principles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;border-bottom:1px solid var(--line);margin-bottom:6px}
.principles div{padding:10px 12px 10px 0;font-size:.8rem;color:var(--muted);display:flex;gap:8px;align-items:baseline}
.principles div::before{content:"";flex:none;width:7px;height:7px;border-radius:2px;background:var(--accent);transform:translateY(-1px)}
.principles strong{color:var(--ink);font-weight:600}

/* tabs */
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:2px;overflow-x:auto;padding-block:8px;border-bottom:1px solid var(--line);scrollbar-width:none}
nav.tabs button{background:none;border:0;padding:8px 14px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
nav.tabs button:hover{background:var(--panel);color:var(--ink)}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
main section{padding-top:20px}
.sec-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between;margin-bottom:14px}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.pad{padding:16px 18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 12px 8px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .l{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--mono);font-size:1.32rem;font-weight:500;letter-spacing:-.01em}
.kpi .c{font-size:.76rem;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag{font-size:.66rem;padding:0 6px;border-radius:4px;border:1px solid currentColor;font-weight:600;letter-spacing:.02em}
.good{color:var(--good)} .bad{color:var(--bad)} .neu{color:var(--muted)}
.kpi .s{font-size:.66rem;color:var(--faint);margin-top:auto}
.kpi svg{display:block;width:100%;height:34px;margin:4px 0 2px}

.glance{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:4px 18px;padding:14px 0;border-top:1px solid var(--line)}
.glance:first-of-type{border-top:0}
.glance .q{font-family:var(--serif);font-weight:600;font-size:1rem}
.meta{font-size:.74rem;color:var(--faint);margin-top:4px}

.chart-card h3{margin-bottom:4px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.76rem;color:var(--muted);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.axis text{fill:var(--faint);font-size:10px;font-family:var(--mono)}
.axis line,.grid-l{stroke:var(--line)}
#tip{position:fixed;pointer-events:none;z-index:50;background:var(--ink);color:var(--bg);font-size:.76rem;padding:6px 9px;border-radius:6px;max-width:280px;line-height:1.35;opacity:0;transition:opacity .08s}
#tip.on{opacity:1}
#tip b{font-family:var(--mono);font-weight:500}

/* copilot */
.copilot{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:16px;align-items:start}
.library{position:sticky;top:64px;max-height:calc(100vh - 90px);overflow:auto}
.library h3{font-size:.95rem;margin:14px 0 6px}
.library h3:first-child{margin-top:0}
.qbtn{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:7px;padding:6px 8px;cursor:pointer;font-size:.83rem;color:var(--ink);line-height:1.35}
.qbtn:hover{background:var(--accent-soft);border-color:var(--line)}
.qbtn .k{font-family:var(--mono);color:var(--accent);margin-right:6px}
.ask{display:flex;gap:8px;margin-bottom:14px}
.ask input{flex:1;min-width:0;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.ghost{background:var(--panel);color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:.8rem}
.thread{display:flex;flex-direction:column;gap:16px}
.you{align-self:flex-end;max-width:85%;background:var(--ink);color:var(--bg);padding:9px 13px;border-radius:12px 12px 2px 12px;font-size:.9rem}
.resp .hd{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;justify-content:space-between;padding:14px 18px 10px;border-bottom:1px solid var(--line)}
.resp .blk{padding:12px 18px;border-bottom:1px solid var(--line)}
.resp .blk:last-child{border-bottom:0}
.lbl{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
.answer{font-size:1rem;line-height:1.55;max-width:75ch;overflow-wrap:anywhere}
.qbtn,.you,td{overflow-wrap:anywhere}
.disc{border:1px solid var(--warn);background:var(--warn-soft);color:var(--ink);border-radius:8px;padding:7px 11px;font-weight:600;font-size:.84rem;margin-top:10px}
.status{border:1px solid var(--bad);color:var(--bad);border-radius:8px;padding:6px 10px;font-size:.82rem;margin-top:10px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.82rem}
th{font-weight:600;text-align:left;color:var(--muted);font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;border-bottom:1px solid var(--line);padding:6px 8px;white-space:nowrap}
td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap}
tr:last-child td{border-bottom:0}
.basis-group{margin:6px 0 10px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.7rem;font-weight:600;letter-spacing:.03em;border-radius:999px;padding:2px 9px;border:1px solid currentColor}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.basis-group ul{margin:6px 0 0;padding-left:18px}
.basis-group li{margin:3px 0;max-width:95ch}
.basis-group li.indent{list-style:circle;margin-left:14px;color:var(--muted)}
.cite{display:block;font-size:.72rem;color:var(--faint)}
.quote{font-family:var(--serif);font-size:.95rem}
.conf{display:flex;flex-wrap:wrap;gap:8px 28px;font-size:.85rem}
.conf b{display:block;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
details{border-top:1px solid var(--line)}
details summary{cursor:pointer;padding:10px 18px;font-size:.82rem;color:var(--accent);font-weight:600}
details .inner{padding:0 18px 14px}
.src a{white-space:nowrap}

/* variance */
tr.clk{cursor:pointer} tr.clk:hover td{background:var(--panel-2)} tr.sel td{background:var(--accent-soft)}
.arrow-up::before{content:"▲ "} .arrow-down::before{content:"▼ "}

/* trees */
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.seg button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.82rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tree{font-size:.84rem}
.tree .row{display:grid;grid-template-columns:minmax(0,1fr) 110px 110px 120px 70px;gap:8px;padding:6px 8px;border-bottom:1px solid var(--line);align-items:baseline}
.tree .row.h{color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.tree .row .n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tree .drill{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-align:left;font-weight:600}
.tree .note{grid-column:1/-1;font-size:.74rem;color:var(--faint)}

/* scenario */
.sliders{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 18px}
.sl label{display:flex;justify-content:space-between;gap:6px;font-size:.8rem;font-weight:600}
.sl label span{font-family:var(--mono);font-weight:500}
.sl input{width:100%;accent-color:var(--accent)}
.sl .b{font-size:.7rem;color:var(--faint)}
.out{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.out .kpi .v{font-size:1.5rem}
.recon{font-size:.76rem;display:inline-flex;gap:6px;align-items:center}

.search{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 11px;font:inherit;width:min(420px,100%)}
.scroll{max-height:520px;overflow:auto}
pre.prompt{white-space:pre-wrap;font-family:var(--mono);font-size:.78rem;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:12px;margin:0;max-height:420px;overflow:auto}
.steps{display:flex;flex-direction:column;gap:6px}
.steps details{border:1px solid var(--line);border-radius:8px;background:var(--panel-2)}
.steps pre{white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:.72rem;margin:0}
footer{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);font-size:.76rem;color:var(--faint)}

@media (max-width:1080px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.sliders{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){.copilot{grid-template-columns:minmax(0,1fr)}.library{position:static;max-height:none}.g2,.g3,#p-variance .grid{grid-template-columns:minmax(0,1fr)!important}.principles{grid-template-columns:1fr 1fr}}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

nce":"High","basis":"Structured financial data / Management commentary / Inference"},{"question":"Why did it change?","answer":"Revenue grew +17.8% while operating income grew +20.8% (operating leverage 1.17x). Operating income moved $26.7B to $155.2B. Gross profit added $31.6B (volume $34.5B, gross-margin-rate effect -$2.9B), while higher R&D, S&M and G&A absorbed $4.9B. Operating margin rose 1.2 pp to 46.8%: gross margin % contributed -0.9 pp and lower operating expenses as a share of revenue contributed +2.0 pp.","confidence":"High","basis":"Structured financial data / Management commentary / Calculated metric"},{"question":"Where is management investing?","answer":"Investment is concentrated in capital expenditure: capex increased $51.4B (+79.6%) to $115.9B (capex intensity 34.9%), while R&D increased $3.1B (+9.5%) to $35.6B (10.7% of revenue).","confidence":"High","basis":"Structured financial data / Calculated metric / Management commentary"},{"question":"What financial risks are visible?","answer":"Management's risk factors emphasise uncertainty around AI demand and cost structure, competition, security and regulation (quoted below). In the numbers, capex intensity rose 12.0 pp to 34.9%; gross margin % fell 0.9 pp to 67.9%; free cash flow margin fell 5.2 pp to 20.2%.","confidence":"Medium","basis":"Management commentary / Structured financial data / Inference"},{"question":"What requires CFO attention?","answer":"6 areas meet the documented review rules: Capital intensity; Earnings-to-cash gap; Gross margin compression; Non-operating volatility; Tax rate movement; Data governance \u2013 restated comparatives.","confidence":"Medium","basis":"Structured financial data / Inference"}],"responses":[{"question":"What changed in the company's financial performance?","group":"Executive demo","intent":"biggest_changes","title":"What changed in FY2026","answer":"The three largest year-over-year moves (by absolute % change) were Additions to property and equipment (capex) increased $51.4B (+79.6%) to $115.9B; Net cash from operations increased $46.8B (+34.4%) to $182.9B; Earnings per share - diluted increased $4.31 (+31.6%) to $17.95.","status":"ok","confidence":"High","basis":["Structured financial data","Management commentary","Inference"],"disclaimer":"","key_numbers":[{"metric":"Total revenue","current":"$331.8B","prior":"$281.7B","change":"+$50.1B (+17.8%)","current_label":"FY2026","prior_label":"FY2025"},{"metric":"Gross margin (gross profit)","current":"$225.5B","prior":"$193.9B","change":"+$31.6B (+16.3%)","current_label":"FY2026","prior_label":"FY2025"},{"metric":"Operating income","current":"$155.2B","prior":"$128.5B","change":"+$26.7B (+20.8%)","current_label":"FY2026","prior_label":"FY2025"},{"metric":"Net income","current":"$133.7B","prior":"$101.8B","change":"+$31.9B (+31.3%)","current_label":"FY2026","prior_label":"FY2025"},{"metric":"Earnings per share - diluted","current":"$17.95","prior":"$13.64","change":"+$4.31 (+31.6%)","current_label":"FY2026","prior_label":"FY2025"},{"metric":"Net cash from operations","current":"$182.9B","prior":"$136.2B","change":"+$46.8B (+34.4%)","current_label":"FY2026","prior_label":"FY2025"},{"metric":"Additions to property and equipment (capex)","current":"$115.9B","prior":"$64.6B","change":"+$51.4B (+79.6%)","current_label":"FY2026","prior_label":"FY2025"},{"metric":"Free cash flow","current":"$67.0B","prior":"$71.6B","change":"-$4.6B (-6.5%)","current_label":"FY2026","prior_label":"FY2025"},{"metric":"Total cash, cash equivalents, and short-term investments","current":"$76.8B","prior":"$94.6B","change":"-$17.7B (-18.7%)","current_label":"FY2026","prior_label":"FY2025"},{"metric":"Gross margin %","current":"67.9%","prior":"68.8%","change":"-0.9 pp","current_label":"FY2026","prior_label":"FY2025"},{"metric":"Operating margin %","current":"46.8%","prior":"45.6%","change":"+1.2 pp","current_label":"FY2026","prior_label":"FY2025"},{"metric":"Net margin %","current":"40.3%","prior":"36.1%","change":"+4.2 pp","current_label":"FY2026","prior_label":"FY2025"}],"statements":[{"text":"#1 by absolute % change: Additions to property and equipment (capex) increased $51.4B (+79.6%) to $115.9B.","basis":"calculated_analysis","citations":[]},{"text":"#2 by absolute % change: Net cash from operations increased $46.8B (+34.4%) to $182.9B.","basis":"calculated_analysis","citations":[]},{"text":"#3 by absolute % change: Earnings per share - diluted increased $4.31 (+31.6%) to $17.95.","basis":"calculated_analysis","citations":[]},{"text":"Gross margin % fell 0.9 pp to 67.9%; operating margin % rose 1.2 pp to 46.8%.","basis":"calculated_analysis","citations":[]},{"text":"\u201cRevenue increased $50.1 billion or 18% driven by growth in Microsoft Cloud. Intelligent Cloud revenue increased driven by Azure. Productivity and Business Processes revenue increased driven by Microsoft 365 Commercial cloud. More Personal Computing revenue decreased driven by XBOX (formerly Gaming), offset in part by growth in Search advertising. Cost of revenue increased $18.5 billion or 21% driven by growth in Microsoft Cloud. Gross margin increased $31.6 billion or 16% with growth across each of our segments. Operating expenses increased $4.9 billion or 7% driven by continued investments in research and development compute capacity, AI talent, and data to support product development that benefits the entire portfolio, impairment and other related expenses in our XBOX business, investments in commercial sales, and higher Copilot advertising expenses. Operating income increased $26.7 \u2026\u201d","basis":"management_commentary","citations":["Microsoft FY2026 Form 10-K, Item 7. Management's Discussion and Analysis (MD&A) \u2013 SUMMARY RESULTS OF OPERATIONS \u203a Fiscal Year 2026 Compared with Fiscal Year 2025, p.37"]},{"text":"\u201cCurrent year net income and diluted EPS were positively impacted by net gains from investments in OpenAI, which resulted in an increase in net income and diluted EPS of $5.0 billion and $0.67, respectively. Prior year net income and diluted EPS were negatively impacted by net losses from investments in OpenAI, which resulted in a decrease in net income and diluted EPS of $3.6 billion and $0.49, respectively.\u201d","basis":"management_commentary","citations":["Microsoft FY2026 Form 10-K, Item 7. Management's Discussion and Analysis (MD&A) \u2013 SUMMARY RESULTS OF OPERATIONS \u203a Fiscal Year 2026 Compared with Fiscal Year 2025, p.38"]},{"text":"Capital expenditure grew faster (+79.6%) than operating cash flow (+34.4%); this may indicate an investment-heavy phase in which free cash flow lags earnings.","basis":"possible_interpretation","citations":[]}],"sources":[{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":50,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"INCOME STATEMENTS - Total revenue FY2026"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":50,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"INCOME STATEMENTS - Total revenue FY2025"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":50,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"INCOME STATEMENTS - Gross margin (gross profit) FY2026"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":50,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"INCOME STATEMENTS - Gross margin (gross profit) FY2025"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":50,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detai tements and Supplementary Data","page":53,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"CASH FLOWS STATEMENTS - Additions to property and equipment (capex) FY2026"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":53,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"CASH FLOWS STATEMENTS - Additions to property and equipment (capex) FY2025"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":52,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"BALANCE SHEETS - Total cash, cash equivalents, and short-term investments FY2026"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":52,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"BALANCE SHEETS - Total cash, cash equivalents, and short-term investments FY2025"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 7. Management's Discussion and Analysis (MD&A)","page":37,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"SUMMARY RESULTS OF OPERATIONS \u203a Fiscal Year 2026 Compared with Fiscal Year 2025"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 7. Management's Discussion and Analysis (MD&A)","page":38,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"SUMMARY RESULTS OF OPERATIONS \u203a Fiscal Year 2026 Compared with Fiscal Year 2025"}],"calculations":[],"tables":{},"audit_id":"a4699163-3359-465d-96ea-07457374a1cd","validation":"deterministic narrative"},{"question":"Why did operating margin change?","group":"Executive demo","intent":"margin_drivers","title":"Operating margin drivers FY2026 vs FY2025","answer":"Operating margin rose 1.2 pp to 46.8%: gross margin % contributed -0.9 pp and lower operating expenses as a share of revenue contributed +2.0 pp.","status":"ok","confidence":"High","basis":["Structured financial data","Calculated metric","Inference","Management commentary"],"disclaimer":"","key_numbers":[{"metric":"Operating margin %","current":"46.8%","prior":"45.6%","change":"+1.2 pp","current_label":"FY2026","prior_label":"FY2025"},{"metric":"Gross margin %","current":"67.9%","prior":"68.8%","change":"-0.9 pp","current_label":"FY2026","prior_label":"FY2025"},{"metric":"R&D as % of revenue","current":"10.7%","prior":"11.5%","change":"-0.8 pp","current_label":"FY2026","prior_label":"FY2025"},{"metric":"Sales & marketing as % of revenue","current":"8.0%","prior":"9.1%","change":"-1.1 pp","current_label":"FY2026","prior_label":"FY2025"},{"metric":"G&A as % of revenue","current":"2.4%","prior":"2.6%","change":"-0.2 pp","current_label":"FY2026","prior_label":"FY2025"}],"statements":[{"text":"Identity: \u0394 operating margin = \u0394 gross margin % \u2212 \u0394 R&D% \u2212 \u0394 S&M% \u2212 \u0394 G&A% (all as % of revenue).","basis":"calculated_analysis","citations":[]},{"text":"Gross margin %: -0.9 pp impact on operating margin.","basis":"calculated_analysis","citations":[]},{"text":"R&D % of revenue: +0.8 pp impact on operating margin.","basis":"calculated_analysis","citations":[]},{"text":"S&M % of revenue: +1.1 pp impact on operating margin.","basis":"calculated_analysis","citations":[]},{"text":"G&A % of revenue: +0.2 pp impact on operating margin.","basis":"calculated_analysis","citations":[]},{"text":"Segment gross margin (segment revenue \u2212 segment cost of revenue): Intelligent Cloud moved -4.2 pp, the largest decline/smallest improvement among segments.","basis":"calculated_analysis","citations":[]},{"text":"A shift in revenue mix toward segments with different gross margins may also contribute to the consolidated change (largest segment by revenue: Productivity and Business Processes, 42%).","basis":"possible_interpretation","citations":[]},{"text":"\u201cRevenue increased $50.1 billion or 18% driven by growth in Microsoft Cloud. Intelligent Cloud revenue increased driven by Azure. Productivity and Business Processes revenue increased driven by Microsoft 365 Commercial cloud. More Personal Computing revenue decreased driven by XBOX (formerly Gaming), offset in part by growth in Search advertising. Cost of revenue increased $18.5 billion or 21% driven by growth in Microsoft Cloud. Gross margin increased $31.6 billion or 16% with growth across each of our segments. Operating expenses increased $4.9 billion or 7% driven by continued investments in research and development compute capacity, AI talent, and data to support product development that benefits the entire portfolio, impairment and other related expenses in our XBOX business, investments in commercial sales, and higher Copilot advertising expenses. Operating income increased $26.7 \u2026\u201d","basis":"management_commentary","citations":["Microsoft FY2026 Form 10-K, Item 7. Management's Discussion and Analysis (MD&A) \u2013 SUMMARY RESULTS OF OPERATIONS \u203a Fiscal Year 2026 Compared with Fiscal Year 2025, p.37"]},{"text":"\u201cOperating income increased $14.1 billion or 20%. Revenue, gross margin, and operating income included a favorable foreign currency impact of 2%, 3%, and 3%, respectively.\u201d","basis":"management_commentary","citations":["Microsoft FY2026 Form 10-K, Item 7. Management's Discussion and Analysis (MD&A) \u2013 SEGMENT RESULTS OF OPERATIONS \u203a Productivity and Business Processes, p.39"]}],"sources":[{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":50,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"INCOME STATEMENTS - Operating income FY2026"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financia gent Cloud","gross_margin_FY2026":0.579973,"gross_margin_FY2025":0.621973,"change_pp":-0.042001,"revenue_share":0.415234},{"segment":"More Personal Computing","gross_margin_FY2026":0.565585,"gross_margin_FY2025":0.53818,"change_pp":0.027405,"revenue_share":0.162886},{"segment":"Productivity and Business Processes","gross_margin_FY2026":0.821302,"gross_margin_FY2025":0.814403,"change_pp":0.006899,"revenue_share":0.421879}]},"audit_id":"c6de02bb-6019-49c5-a8f1-0843e7c8d070","validation":"deterministic narrative"},{"question":"Which segment drove revenue growth?","group":"Executive demo","intent":"segment","title":"Segment analysis FY2026 vs FY2025","answer":"Intelligent Cloud contributed most to revenue growth: $31.5B or 63% of the $50.1B total increase.","status":"ok","confidence":"High","basis":["Structured financial data","Management commentary"],"disclaimer":"","key_numbers":[{"metric":"Intelligent Cloud revenue","current":"$137.8B","prior":"$106.3B","change":"+$31.5B (+29.7%)","current_label":"FY2026","prior_label":"FY2025"},{"metric":"More Personal Computing revenue","current":"$54.1B","prior":"$54.6B","change":"-$597M (-1.1%)","current_label":"FY2026","prior_label":"FY2025"},{"metric":"Productivity and Business Processes revenue","current":"$140.0B","prior":"$120.8B","change":"+$19.2B (+15.9%)","current_label":"FY2026","prior_label":"FY2025"},{"metric":"Total revenue","current":"$331.8B","prior":"$281.7B","change":"+$50.1B (+17.8%)","current_label":"FY2026","prior_label":"FY2025"}],"statements":[{"text":"Intelligent Cloud: revenue $137.8B (+29.7%), contributed 63% of total revenue growth (+11.2 pp of the +17.8%); operating margin 41.3% (FY2025: 42.0%).","basis":"calculated_analysis","citations":[]},{"text":"More Personal Computing: revenue $54.1B (-1.1%), contributed -1% of total revenue growth (-0.2 pp of the +17.8%); operating margin 26.6% (FY2025: 25.9%).","basis":"calculated_analysis","citations":[]},{"text":"Productivity and Business Processes: revenue $140.0B (+15.9%), contributed 38% of total revenue growth (+6.8 pp of the +17.8%); operating margin 59.9% (FY2025: 57.8%).","basis":"calculated_analysis","citations":[]},{"text":"Rankings use explicit definitions: contribution = segment \u0394revenue / total \u0394revenue; growth = segment revenue YoY %; margin = segment operating income / segment revenue. No subjective 'performance' score is applied.","basis":"calculated_analysis","citations":[]},{"text":"Within Intelligent Cloud, the largest revenue increase came from Server products and cloud services ($31.0B).","basis":"calculated_analysis","citations":[]},{"text":"Within Productivity and Business Processes, the largest revenue increase came from Microsoft 365 Commercial products and cloud services ($14.2B).","basis":"calculated_analysis","citations":[]},{"text":"Within More Personal Computing, the largest revenue increase came from Search advertising ($1.3B).","basis":"calculated_analysis","citations":[]},{"text":"\u201cRevenue increased $50.1 billion or 18% driven by growth in Microsoft Cloud. Intelligent Cloud revenue increased driven by Azure. Productivity and Business Processes revenue increased driven by Microsoft 365 Commercial cloud. More Personal Computing revenue decreased driven by XBOX (formerly Gaming), offset in part by growth in Search advertising. Cost of revenue increased $18.5 billion or 21% driven by growth in Microsoft Cloud. Gross margin increased $31.6 billion or 16% with growth across each of our segments. Operating expenses increased $4.9 billion or 7% driven by continued investments in research and development compute capacity, AI talent, and data to support product development that benefits the entire portfolio, impairment and other related expenses in our XBOX business, investments in commercial sales, and higher Copilot advertising expenses. Operating income increased $26.7 \u2026\u201d","basis":"management_commentary","citations":["Microsoft FY2026 Form 10-K, Item 7. Management's Discussion and Analysis (MD&A) \u2013 SUMMARY RESULTS OF OPERATIONS \u203a Fiscal Year 2026 Compared with Fiscal Year 2025, p.37"]},{"text":"\u201cSales and marketing expenses increased $1.1 billion or 4% driven by investments in commercial sales and higher Copilot advertising expenses.\u201d","basis":"management_commentary","citations":["Microsoft FY2026 Form 10-K, Item 7. Management's Discussion and Analysis (MD&A) \u2013 OPERATING EXPENSES \u203a Sales and Marketing \u203a Fiscal Year 2026 Compared with Fiscal Year 2025, p.40"]}],"sources":[{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":84,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"Segment revenue, cost of revenue, operating expenses, and operating income were as follows during the periods presented: - Segment revenue - Intelligent Cloud FY2026"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":84,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"Segment revenue, cost of revenue, operating expenses, and operating income were as follows during the periods presented: - Segment revenue - Intelligent Cloud FY2025"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":84,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"Segment revenue, cost of revenue, operating expenses, and operating income were as follows during the periods presented: - Segment operating income - Intelligent Cloud FY2026"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":84,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"Segment revenue, cost of revenue, operating expenses, and operating income  pp","current_label":"FY2026","prior_label":"FY2025"}],"statements":[{"text":"Operating cash flow increased $46.8B (+34.4%) to $182.9B; capex increased $51.4B (+79.6%) to $115.9B.","basis":"factual_observation","citations":[]},{"text":"Free cash flow (OCF \u2212 capex) decreased $4.6B (-6.5%) to $67.0B.","basis":"calculated_analysis","citations":[]},{"text":"63.4% of operating cash flow was reinvested in property and equipment (capex / OCF).","basis":"calculated_analysis","citations":[]},{"text":"Free cash flow was 0.50x net income (FCF / net income).","basis":"calculated_analysis","citations":[]},{"text":"FCF below net income can reflect heavy capital investment and non-cash gains in net income; the filing's cash-flow commentary should be read for the specific causes.","basis":"possible_interpretation","citations":[]},{"text":"\u201cCash from operations increased $46.8 billion to $182.9 billion for fiscal year 2026, primarily due to an increase in cash received from customers and a decrease in cash used to pay income taxes, offset in part by an increase in cash paid to suppliers. Cash used in financing increased $847 million to $52.5 billion for fiscal year 2026, primarily due to a $6.0 billion decrease in cash used for repayments of debt, offset in part by a $3.9 billion increase in common stock repurchases and a $2.4 billion increase in dividends paid. Cash used in investing increased $66.9 billion to $139.5 billion for fiscal year 2026, primarily due to a $51.4 billion increase in additions to property and equipment and a $22.2 billion increase in cash used in other investing primarily to facilitate the purchase of components, offset in part by a $4.2 billion decrease in cash used in the acquisition of \u2026\u201d","basis":"management_commentary","citations":["Microsoft FY2026 Form 10-K, Item 7. Management's Discussion and Analysis (MD&A) \u2013 LIQUIDITY AND CAPITAL RESOURCES \u203a Cash Flows, p.43"]}],"sources":[{"document":"Microsoft FY2026 Form 10-K","sect "current_label":"FY2026","prior_label":"FY2025"},{"metric":"Total revenue","current":"$331.8B","prior":"$281.7B","change":"+$50.1B (+17.8%)","current_label":"FY2026","prior_label":"FY2025"}],"statements":[{"text":"Largest absolute increase: Cost of revenue - service and other ($19.9B, +26.8%).","basis":"calculated_analysis","citations":[]},{"text":"Fastest growth rate: Cost of revenue - service and other (+26.8%).","basis":"calculated_analysis","citations":[]},{"text":"Operating expenses (R&D + S&M + G&A) grew +7.4% versus revenue +17.8% - i.e. slower than revenue.","basis":"calculated_analysis","citations":[]},{"text":"Cost of revenue grew +21.1%, faster than revenue.","basis":"calculated_analysis","citations":[]},{"text":"\u201cRevenue increased $50.1 billion or 18% driven by growth in Microsoft Cloud. Intelligent Cloud revenue increased driven by Azure. Productivity and Business Processes revenue increased driven by Microsoft 365 Commercial cloud. More Personal Computing revenue decreased driven by XBOX (formerly Gaming), offset in part by growth in Search advertising. Cost of revenue increased $18.5 billion or 21% driven by growth in Microsoft Cloud. Gross margin increased $31.6 billion or 16% with growth across each of our segments. Operating expenses increased $4.9 billion or 7% driven by continued investments in research and development compute capacity, AI talent, and data to support product development that benefits the entire portfolio, impairment and other related expenses in our XBOX business, investments in commercial sales, and higher Copilot advertising expenses. Operating income increased $26.7 \u2026\u201d","basis":"management_commentary","citations":["Microsoft FY2026 Form 10-K, Item 7. Management's Discussion and Analysis (MD&A) \u2013 SUMMARY RESULTS OF OPERATIONS \u203a Fiscal Year 2026 Compared with Fiscal Year 2025, p.37"]},{"text":"\u201cResearch and development expenses increased $3.1 billion or 9% driven by continued investments in compute rent":"34.9%","prior":"22.9%","change":"+12.0 pp","current_label":"FY2026","prior_label":"FY2025"}],"statements":[{"text":"Additions to property and equipment (capex) increased $51.4B (+79.6%) to $115.9B in FY2026 (FY2025: $64.6B).","basis":"factual_observation","citations":[]},{"text":"Additions to property and equipment (capex) CAGR FY2023-FY2026: 60.4% (compound annual growth).","basis":"calculated_analysis","citations":[]},{"text":"Capex intensity rose 12.0 pp to 34.9%.","basis":"calculated_analysis","citations":[]},{"text":"\u201cCash from operations increased $46.8 billion to $182.9 billion for fiscal year 2026, primarily due to an increase in cash received from customers and a decrease in cash used to pay income taxes, offset in part by an increase in cash paid to suppliers. Cash used in financing increased $847 million to $52.5 billion for fiscal year 2026, primarily due to a $6.0 billion decrease in cash used for repayments of debt, offset in part by a $3.9 billion increase in common stock repurchases and a $2.4 billion increase in dividends paid. Cash used in investing increased $66.9 billion to $139.5 billion for fiscal year 2026, primarily due to a $51.4 billion increase in additions to property and equipment and a $22.2 billion increase in cash used in other investing primarily to facilitate the purchase of components, offset in part by a $4.2 billion decrease in cash used in the acquisition of \u2026\u201d","basis":"management_commentary","citations":["Microsoft FY2026 Form 10-K, Item 7. Management's Discussion and Analysis (MD&A) \u2013 LIQUIDITY AND CAPITAL RESOURCES \u203a Cash Flows, p.43"]}],"sources":[{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":53,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"CASH FLOWS STATEMENTS - Additions to property and equipment (capex) FY2026"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":53,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"CASH FLOWS STATEMENTS - Additions to property and equipment (capex) FY2025"},{"document":"Microsoft FY2025 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":53,"url":"https://www.sec.gov/Archives/edgar/data/789019/000095017025100235/msft-20250630.htm","detail":"CASH FLOWS STATEMENTS - Additions to property and equipment (capex) FY2023"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":50,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"INCOME STATEMENTS - Total revenue FY2026"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":50,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"INCOME STATEMENTS - Total revenue FY2025"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 7. Management's Discussion and Analysis (MD&A)","page":43,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"LIQUIDITY AND CAPITAL RESOURCES \u203a Cash Flows"}],"calculations":[{"name":"Additions to property and equipment (capex) CAGR FY2023-FY2026","fy":2026,"value":"60.38%","formula":"(Value FY2026 / Value FY2023)^(1/3) - 1","inputs":"(115,948 / 28,107)^(1/3) - 1","status":"ok","proxy":false,"engine":"1.0.0"}],"tables":{},"audit_id":"fe03f0af-b738-49f6-8620-2588d1dce9c0","validation":"deterministic narrative"},{"question":"What are the main financial risks disclosed by management?","group":"Executive demo","intent":"risks","title":"Financial risks visible in the FY2026 filing","answer":"Management's risk factors emphasise uncertainty around AI demand and cost structure, competition, security and regulation (quoted below). In the numbers, capex intensity rose 12.0 pp to 34.9%; gross margin % fell 0.9 pp to 67.9%; free cash flow margin fell 5.2 pp to 20.2%.","status":"ok","confidence":"Medium","basis":["Management commentary","Structured financial data","Inference"],"disclaimer":"","key_numbers":[{"metric":"Capex intensity","current":"34.9%","prior":"22.9%","change":"+12.0 pp","current_label":"FY2026","prior_label":"FY2025"},{"metric":"Gross margin %","current":"67.9%","prior":"68.8%","change":"-0.9 pp","current_label":"FY2026","prior_label":"FY2025"},{"metric":"Free cash flow margin","current":"20.2%","prior":"25.4%","change":"-5.2 pp","current_label":"FY2026","prior_label":"FY2025"},{"metric":"Cash conversion (FCF / net income)","current":"0.50x","prior":"0.70x","change":"-0.20x","current_label":"FY2026","prior_label":"FY2025"}],"statements":[{"text":"\u201cOur cloud and AI strategy requires substantial investments and depends on evolving customer demand, technological developments, competitive dynamics, and regulatory conditions, any of which could adversely affect our business, financial condition, and results of operations. We have made and are continuing to make significant capital and operational investments to develop, train, deploy, and support AI models and related cloud-based services, including building and expanding datacenters, acquiring necessary components, and securing energy resources. These investments are being made at significant scale and on an accelerated timeline, require substantial and increasing capital expenditures and continued access to capital, and are in advance of fully developed revenue streams. The associated revenue may not be realized in the expected timeframes or at expected levels. Our capital and \u2026\u201d","basis":"management_commentary","citations":["Microsoft FY2026 Form 10-K, Item 1A. Risk Factors \u2013 STRATEGIC AND COMPETITIVE RISKS \u203a Business model competition, p.15"]},{"text":"\u201cOur success depends on our ability to develop, deliver, and maintain competitive cloud-based and AI products and services that achieve broad customer adoption and sustainable revenue growth. Our ability to succeed depends on our ability to develop and deliver differentiated products and services that meet evolving customer needs, achieve broad adoption, maintain customer trust, and generate sustainable revenue and growth. The markets for cloud-based and AI products and services are highly dynamic, characterized by shifting customer expectations, increasing regulatory and governmental scrutiny, intense competition, and rapid technological change, such as the accelerating importance of agentic computing. Whether we succeed in cloud-based and AI products and services depends on our execution in several areas, including:\u201d","basis":"management_commentary","citations":["Microsoft FY2026 Form 10-K, Item 1A. Risk Factors \u2013 STRATEGIC AND COMPETITIVE RISKS \u203a Business model competition, p.16"]},{"text":"\u201cCyberattacks and security vulnerabilities could lead to reduced revenue, increased costs, liability claims, or harm to our reputation or competitive position.\u201d","basis":"management_commentary","citations":["Microsoft FY2026 Form 10-K, Item 1A. Risk Factors \u2013 CYBERSECURITY, DATA PRIVACY, AND PLATFORM ABUSE RISKS, p.17"]},{"text":"\u201cWe may have additional tax liabilities. We are subject to income taxes in the U.S. and many foreign jurisdictions. Significant judgment is required in determining our worldwide provision for income taxes. In the course of our business, there are many transactions and calculations where the ultimate tax determination is uncertain. We may recognize additional tax expense and be subject to additional tax liabilities due to changes in tax laws, regulations, and administrative practices and principles, including changes to the global tax framework, in various jurisdictions. In recent years, multiple domestic and international tax proposals were proposed to impose greater tax burdens on large multinational enterprises. The Organisation for Economic Co-operation and Development continues to advance proposals or guidance in international taxation, including global minimum tax.\u201d","basis":"management_commentary","citations":["Microsoft FY2026 Form 10-K, Item 1A. Risk Factors \u2013 LEGAL, REGULATORY, AND LITIGATION RISKS, p.26"]},{"text":"\u201cHow these laws and regulations apply to our business is often unclear, subject to change, and sometimes may conflict or be inconsistent from jurisdiction to jurisdiction. In addition, governments\u2019 approach to enforcement, and our products and services, are continuing to evolve. Compliance with existing, expanding, or new laws and regulations may involve significant costs and operational efforts, or require changes in products or business practices that could adversely affect our results of operations. Noncompliance could result in the imposition of penalties, criminal sanctions, or orders to cease the alleged noncompliant activity. If our products do not meet customer expectations or legal requirements, we could face regulatory or legal actions, and our business, operations, financial condition, and results of operations could be adversely affected.\u201d","basis":"management_commentary","citations":["Microsoft FY2026 Form 10-K, Item 1A. Risk Factors \u2013 LEGAL, REGULATORY, AND LITIGATION RISKS, p.25"]},{"text":"\u201cinadequate datacenter capacity to support the delivery and continued development of our products and services. Component shortages, excess or obsolete inventory, or price reductions resulting in inventory adjustments have and may increase our cost of revenue. In addition to infrastructure, other products such as XBOX consoles, Surface devices, and other hardware are similarly subject to supply chain challenges and disruptions, resulting in shortages which could adversely affect our business, operations, financial condition, and results of operations.\u201d","basis":"management_commentary","citations":["Microsoft FY2026 Form 10-K, Item 1A. Risk Factors \u2013 OPERATIONAL RISKS, p.23"]},{"text":"Indicator \u2013 rising capital intensity: Capex intensity rose 12.0 pp to 34.9%.","basis":"calculated_analysis","citations":[]},{"text":"Indicator \u2013 gross margin % trend: Gross margin % fell 0.9 pp to 67.9%.","basis":"calculated_analysis","citations":[]},{"text":"Indicator \u2013 free cash flow margin trend: Free cash flow margin fell 5.2 pp to 20.2%.","basis":"calculated_analysis","citations":[]},{"text":"Indicator \u2013 FCF / net income: Cash conversion (FCF / net income) decreased 0.20x to 0.50x.","basis":"calculated_analysis","citations":[]},{"text":"Other income (expense), net was $10.7B (6.4% of pre-tax income); non-operating items can make net income more volatile than operating income.","basis":"calculated_analysis","citations":[]},{"text":"The quoted risk-factor passages are management's disclosures; the indicators are calculated from reported figures. Neither is a prediction.","basis":"possible_interpretation","citations":[]}],"sources":[{"document":"Microsoft FY2026 Form 10-K","section":"Item 1A. Risk Factors","page":15,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"STRATEGIC AND COMPETITIVE RISKS \u203a Business model competition"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 1A. Risk Factors","page":16,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"STRATEGIC AND COMPETITIVE RISKS \u203a Business model competition"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 1A. Risk Factors","page":17,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"CYBERSECURITY, DATA PRIVACY, AND PLATFORM ABUSE RISKS"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 1A. Risk Factors","page":26,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"LEGAL, REGULATORY, AND LITIGATION RISKS"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 1A. Risk Factors","page":25,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"LEGAL, REGULATORY, AND LITIGATION RISKS"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 1A. Risk Factors","page":23,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"OPERATIONAL RISKS"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":53,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"CASH FLOWS STATEMENTS - Additions to property and equipment (capex) FY2026"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":50,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"INCOME STATEMENTS - Total revenue FY2026"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":53,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"CASH FLOWS STATEMENTS - Additions to property and equipment (capex) FY2025"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":50,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"INCOME STATEMENTS - Total revenue FY2025"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":50,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"INCOME STATEMENTS - Gross margin (gross profit) FY2026"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","  and Supplementary Data","page":50,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"INCOME STATEMENTS - General and administrative FY2026"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":50,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"INCOME STATEMENTS - Total revenue FY2025"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":50,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"INCOME STATEMENTS - Gross margin (gross profit) FY2026"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":50,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"INCOME STATEMENTS - Provision for income taxes FY2026"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":50,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"INCOME STATEMENTS - Income before income taxes FY2026"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":53,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"CASH FLOWS STATEMENTS - Additions to property and equipment (capex) FY2026"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":53,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"CASH FLOWS STATEMENTS - Net cash from operations FY2026"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":50,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"INCOME STATEMENTS - Net income FY2026"}],"calculations":[{"name":"Total revenue","fy":2026,"value":"$331.84B","formula":"Reported value","inputs":"$331.8B","status":"ok","proxy":false,"engine":"1.0.0"},{"name":"Research and development","fy":2026,"value":"$35.56B","formula":"Reported value","inputs":"$35.6B","status":"ok","proxy":false,"engine":"1.0.0"},{"name":"Sales and marketing","fy":2026,"value":"$26.71B","formula":"Reported value","inputs":"$26.7B","status":"ok","proxy":false,"engine":"1.0.0"},{"name":"General and administrative","fy":2026,"value":"$7.96B","formula":"Reported value","inputs":"$8.0B","status":"ok","proxy":false,"engine":"1.0.0"},{"name":"Revenue growth (YoY)","fy":2026,"value":"17.79%","formula":"(Revenue[t] - Revenue[t-1]) / Revenue[t-1]","inputs":"Total revenue FY2026 = 331,839.00 (USD millions, p.50); Total revenue FY2025 = 281,724.00 (USD millions, p.50)","status":"ok","proxy":false,"engine":"1.0.0"},{"name":"Gross margin %","fy":2026,"value":"67.94%","formula":"Gross margin / Revenue","inputs":"Gross margin (gross profit) FY2026 = 225,465.00 (USD millions, p.50); Total revenue FY2026 = 331,839.00 (USD millions, p.50)","status":"ok","proxy":false,"engine":"1.0.0"},{"name":"Effective tax rate (calculated)","fy":2026,"value":"19.40%","formula":"Provision for income taxes / Income before income taxes","inputs":"Provision for income taxes FY2026 = 32,185.00 (USD millions, p.50); Income before income taxes FY2026 = 165,934.00 (USD millions, p.50)","status":"ok","proxy":false,"engine":"1.0.0"},{"name":"Capex intensity","fy":2026,"value":"34.94%","formula":"Additions to property and equipment / Revenue","inputs":"Additions to property and equipment (capex) FY2026 = 115,948.00 (USD millions, p.53); Total revenue FY2026 = 331,839.00 (USD millions, p.50)","status":"ok","proxy":false,"engine":"1.0.0"},{"name":"Operating cash flow / net income","fy":2026,"value":"1.37x","formula":"Net cash from operations / Net income","inputs":"Net cash from operations FY2026 = 182,935.00 (USD millions, p.53); Net income FY2026 = 133,749.00 (USD millions, p.50)","status":"ok","proxy":false,"engine":"1.0.0"}],"tables":{"assumptions":[{"assumption":"revenue_growth","base_case":0.177887,"scenario":0.127887,"base_case_source":"FY2026 actual revenue growth (calculated)"},{"assumption":"gross_margin","base_case":0.679441,"scenario":0.679441,"base_case_source":"FY2026 actual gross margin % (calculated)"},{"assumption":"rd_growth","base_case":0.09462,"scenario":0.09462,"base_case_source":"FY2026 actual R&D growth"},{"assumption":"sm_growth","base_case":0.041163,"scenario":0.041163,"base_case_source":"FY2026 actual S&M growth"},{"assumption":"ga_growth","base_case":0.101481,"scenario":0.101481,"base_case_source":"FY2026 actual G&A growth"},{"assumption":"other_income","base_case":0.0,"scenario":0.0,"base_case_source":"Set to 0 - non-operating items (e.g. investment gains/losses) are volatile and not extrapolated"},{"assumption":"tax_rate","base_case":0.193963,"scenario":0.193963,"base_case_source":"FY2026 effective tax rate (provision / pre-tax income)"},{"assumption":"capex_intensity","base_case":0.34941,"scenario":0.34941,"base_case_source":"FY2026 capex / revenue"},{"assumption":"ocf_to_net_income","base_case":1.367749,"scenario":1.367749,"base_case_source":"FY2026 OCF / net income"}],"scenario_results":[{"line":"revenue","base_case":390868.80039,"scenario":374276.85039,"delta":-16591.95,"delta_pct":-0.042449},{"line":"gross_profit","base_case":265572.262693,"scenario":254299.012693,"delta":-11273.25,"delta_pct":-0.042449},{"line":"operating_income","base_case":190072.548031,"scenario":178799.298031,"delta":-11273.25,"delta_pct":-0.05931},{"line":"operating_margin","base_case":0.486282,"scenario":0.477719,"delta":-0.008563,"delta_pct":null},{"line":"net_income","base_case":153205.57105,"scenario":144118.910605,"delta":-9086.660445,"delta_pct":-0.05931},{"line":"operating_cash_flow","base_case":209546.696723,"scenario":197118.430131,"delta":-12428.266592,"delta_pct":-0.05931},{"line":"capital_expenditure","base_case":136573.626571,"scenario":130776.226571,"delta":-5797.4,"delta_pct":-0.042449},{"line":"free_cash_flow","base_case":72973.070153,"scenario":66342.20356,"delta":-6630.866592,"delta_pct":-0.090867}]},"audit_id":"71384e46-2fc2-4736-b21f-ab7dd28db6d7","validation":"deterministic narrative"},{"question":"Revenue increased significantly, but operating margin moved differently. Explain the bridge between revenue growth and operating-income growth, identify the major cost drivers, distinguish management's stated explanations from your own calculated analysis, and show me the source for every number.","group":"Killer demo","intent":"profitability_bridge","title":"Revenue growth \u2192 operating income growth bridge, FY2026 vs FY2025","answer":"Revenue grew +17.8% while operating income grew +20.8% (operating leverage 1.17x). Operating income moved $26.7B to $155.2B. Gross profit added $31.6B (volume $34.5B, gross-margin-rate effect -$2.9B), while higher R&D, S&M and G&A absorbed $4.9B. Operating margin rose 1.2 pp to 46.8%: gross margin % contributed -0.9 pp and lower operating expenses as a share of revenue contributed +2.0 pp.","status":"ok","confidence":"High","basis":["Structured financial data","Management commentary","Calculated metric"],"disclaimer":"","key_numbers":[{"metric":"Operating income","current":"$155.2B","prior":"$128.5B","change":"+$26.7B (+20.8%)","current_label":"FY2026","prior_label":"FY2025"},{"metric":"Total revenue","current":"$331.8B","prior":"$281.7B","change":"+$50.1B (+17.8%)","current_label":"FY2026","prior_label":"FY2025"},{"metric":"Gross margin (gross profit)","current":"$225.5B","prior":"$193.9B","change":"+$31.6B (+16.3%)","current_label":"FY2026","prior_label":"FY2025"},{"metric":"Research and development","current":"$35.6B","prior":"$32.5B","change":"+$3.1B (+9.5%)","current_label":"FY2026","prior_label":"FY2025"},{"metric":"Sales and marketing","current":"$26.7B","prior":"$25.7B","change":"+$1.1B (+4.1%)","current_label":"FY2026","prior_label":"FY2025"},{"metric":"General and administrative","current":"$8.0B","prior":"$7.2B","change":"+$733M (+10.1%)","current_label":"FY2026","prior_label":"FY2025"},{"metric":"Operating margin %","current":"46.8%","prior":"45.6%","change":"+1.2 pp","current_label":"FY2026","prior_label":"FY2025"}],"statements":[{"text":"Gross margin (gross profit): $31.6B contribution to the change in operating income (118% of the change).","basis":"calculated_analysis","citations":[]},{"text":"  \u2013 Revenue growth at prior-year gross margin % (volume): $34.5B ((Revenue[t] - Revenue[t-1]) x GM%[t-1] = (331,839 - 281,724) x 68.82%).","basis":"calculated_analysis","citations":[]},{"text":"  \u2013 Change in gross margin % (rate / mix): -$2.9B ((GM%[t] - GM%[t-1]) x Revenue[t] = (67.94% - 68.82%) x 331,839).","basis":"calculated_analysis","citations":[]},{"text":"Research and development (cost increase reduces OI): -$3.1B contribution to the change in operating income (-12% of the change).","basis":"calculated_analysis","citations":[]},{"text":"Sales and marketing (cost increase reduces OI): -$1.1B contribution to the change in operating income (-4% of the change).","basis":"calculated_analysis","citations":[]},{"text":"General and administrative (cost increase reduces OI): -$733M contribution to the change in operating income (-3% of the change).","basis":"calculated_analysis","citations":[]},{"text":"Bridge reconciles: sum of drivers = 26,709 vs reported change 26,709.","basis":"calculated_analysis","citations":[]},{"text":"\u201cRevenue increased $50.1 billion or 18% driven by growth in Microsoft Cloud. Intelligent Cloud revenue increased driven by Azure. Productivity and Business Processes revenue increased driven by Microsoft 365 Commercial cloud. More Personal Computing revenue decreased driven by XBOX (formerly Gaming), offset in part by growth in Search advertising. Cost of revenue increased $18.5 billion or 21% driven by growth in Microsoft Cloud. Gross margin increased $31.6 billion or 16% with growth across each of our segments. Operating expenses increased $4.9 billion or 7% driven by continued investments in research and development compute capacity, AI talent, and data to support product development that benefits the entire portfolio, impairment and other related expenses in our XBOX business, investments in commercial sales, and higher Copilot advertising expenses. Operating income increased $26.7 \u2026\u201d","basis":"management_commentary","citations":["Microsoft FY2026 Form 10-K, Item 7. Management's Discussion and Analysis (MD&A) \u2013 SUMMARY RESULTS OF OPERATIONS \u203a Fiscal Year 2026 Compared with Fiscal Year 2025, p.37"]},{"text":"\u201cOperating income increased $220 million or 2%. Operating income included a favorable foreign currency impact of 2%.\u201d","basis":"management_commentary","citations":["Microsoft FY2026 Form 10-K, Item 7. Management's Discussion and Analysis (MD&A) \u2013 SEGMENT RESULTS OF OPERATIONS \u203a More Personal Computing, p.40"]},{"text":"Revenue grew +17.8% and operating income grew +20.8%; degree of operating leverage 1.17x (operating income grew faster than revenue).","basis":"calculated_analysis","citations":[]},{"text":"Identity: \u0394 operating margin = \u0394 gross margin % \u2212 \u0394 R&D% \u2212 \u0394 S&M% \u2212 \u0394 G&A% (all as % of revenue).","basis":"calculated_analysis","citations":[]},{"text":"Gross margin %: -0.9 pp impact on operating margin.","basis":"calculated_analysis","citations":[]},{"text":"R&D % of revenue: +0.8 pp impact on operating margin.","basis":"calculated_analysis","citations":[]},{"text":"S&M % of revenue: +1.1 pp impact on operating margin.","basis":"calculated_analysis","citations":[]},{"text":"G&A % of revenue: +0.2 pp impact on operating margin.","basis":"calculated_analysis","citations":[]},{"text":"Segme 15.9%)","current_label":"FY2026","prior_label":"FY2025"},{"metric":"Total revenue","current":"$331.8B","prior":"$281.7B","change":"+$50.1B (+17.8%)","current_label":"FY2026","prior_label":"FY2025"}],"statements":[{"text":"Intelligent Cloud: revenue $137.8B (+29.7%), contributed 63% of total revenue growth (+11.2 pp of the +17.8%); operating margin 41.3% (FY2025: 42.0%).","basis":"calculated_analysis","citations":[]},{"text":"More Personal Computing: revenue $54.1B (-1.1%), contributed -1% of total revenue growth (-0.2 pp of the +17.8%); operating margin 26.6% (FY2025: 25.9%).","basis":"calculated_analysis","citations":[]},{"text":"Productivity and Business Processes: revenue $140.0B (+15.9%), contributed 38% of total revenue growth (+6.8 pp of the +17.8%); operating margin 59.9% (FY2025: 57.8%).","basis":"calculated_analysis","citations":[]},{"text":"Rankings use explicit definitions: contribution = segment \u0394revenue / total \u0394revenue; growth = segment revenue YoY %; margin = segment operating income / segment revenue. No subjective 'performance' score is applied.","basis":"calculated_analysis","citations":[]},{"text":"Within Intelligent Cloud, the largest revenue increase came from Server products and cloud services ($31.0B).","basis":"calculated_analysis","citations":[]},{"text":"Within Productivity and Business Processes, the largest revenue increase came from Microsoft 365 Commercial products and cloud services ($14.2B).","basis":"calculated_analysis","citations":[]},{"text":"Within More Personal Computing, the largest revenue increase came from Search advertising ($1.3B).","basis":"calculated_analysis","citations":[]},{"text":"\u201cRevenue increased $50.1 billion or 18% driven by growth in Microsoft Cloud. Intelligent Cloud revenue increased driven by Azure. Productivity and Business Processes revenue increased driven by Microsoft 365 Commercial cloud. More Personal Computing revenue decreased driven by XBOX (formerly Gaming), offset in part by growth in Search advertising. Cost of revenue increased $18.5 billion or 21% driven by growth in Microsoft Cloud. Gross margin increased $31.6 billion or 16% with growth across each of our segments. Operating expenses increased $4.9 billion or 7% driven by continued investments in research and development compute capacity, AI talent, and data to support product development that benefits the entire portfolio, impairment and other related expenses in our XBOX business, investments in commercial sales, and higher Copilot advertising expenses. Operating income increased $26.7 \u2026\u201d","basis":"management_commentary","citations":["Microsoft FY2026 Form 10-K, Item 7. Management's Discussion and Analysis (MD&A) \u2013 SUMMARY RESULTS OF OPERATIONS \u203a Fiscal Year 2026 Compared with Fiscal Year 2025, p.37"]},{"text":"\u201cSales and marketing expenses increased $1.1 billion or 4% driven by investments in commercial sales and higher Copilot advertising expenses.\u201d","basis":"management_commentary","citations":["Microsoft FY2026 Form 10-K, Item 7. Management's Discussion and Analysis (MD&A) \u2013 OPERATING EXPENSES \u203a Sales and Marketing \u203a Fiscal Year 2026 Compared with Fiscal Year 2025, p.40"]}],"sources":[{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":84,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"Segment revenue, cost of revenue, operating expenses, and operating income were as follows during the periods presented: - Segment revenue - Intelligent Cloud FY2026"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":84,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"Segment revenue, cost of revenue, operating expenses, and operating income were as follows during the periods presented: - Segment revenue - Intelligent Cloud FY2025"} nd average maturity of our fixed-income portfolio are managed to achieve economic returns that correlate to certain fixed-income indices. The settlement risk related to \u2026\u201d","basis":"management_commentary","citations":["Microsoft FY2026 Form 10-K, Item 7. Management's Discussion and Analysis (MD&A) \u2013 LIQUIDITY AND CAPITAL RESOURCES \u203a Cash, Cash Equivalents, and Investments, p.43"]}],"sources":[{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":52,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"BALANCE SHEETS - Cash and cash equivalents FY2026"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":52,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"BALANCE SHEETS - Cash and cash equivalents FY2025"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":52,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"BALANCE SHEETS - Short-term investments FY2026"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":52,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"BALANCE SHEETS - Short-term investments FY2025"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":52,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"BALANCE SHEETS - Total cash, cash equivalents, and short-term investments FY2026"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":52,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"BALANCE SHEETS - Total cash, cash equivalents, and short-term investments FY2025"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":52,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"BALANCE SHEETS - Current portion of long-term debt (short-term debt) FY2026"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":52,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"BALANCE SHEETS - Long-term debt FY2026"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":52,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"BALANCE SHEETS - Current portion of long-term debt (short-term debt) FY2025"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":52,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"BALANCE SHEETS - Long-term debt FY2025"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":52,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"BALANCE SHEETS - Total current assets FY2026"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":52,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"BALANCE SHEETS - Total current liabilities FY2026"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":52,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"BALANCE SHEETS - Total current assets FY2025"},{"document"

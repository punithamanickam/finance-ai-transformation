assets / Total current liabilities","inputs":"Total current assets FY2026 = 207,710.00 (USD millions, p.52); Total current liabilities FY2026 = 168,825.00 (USD millions, p.52)","status":"ok","proxy":false,"engine":"1.0.0"},{"name":"Debt-to-equity","fy":2026,"value":"0.09x","formula":"(Current portion of long-term debt + Long-term debt) / Total stockholders' equity","inputs":"Current portion of long-term debt (short-term debt) FY2026 = 9,227.00 (USD millions, p.52); Long-term debt FY2026 = 31,067.00 (USD millions, p.52); Total stockholders' equity FY2026 = 442,387.00 (USD millions, p.52)","status":"ok","proxy":false,"engine":"1.0.0"}],"tables":{},"audit_id":"acdf4309-79f9-4085-8e46-1d60e4043f8a","validation":"deterministic narrative"},{"question":"How does free cash flow compare with net income?","group":"More","intent":"cash_flow","title":"Cash flow FY2026 vs FY2025","answer":"Operating cash flow increased $46.8B (+34.4%) to $182.9B, but capex increased $51.4B (+79.6%) to $115.9B, so free cash flow decreased $4.6B (-6.5%) to $67.0B. Capex absorbed 63.4% of operating cash flow.","status":"ok","confidence":"High","basis":["Structured financial data","Calculated metric","Inference","Management commentary"],"disclaimer":"","key_numbers":[{"metric":"Net cash from operations","current":"$182.9B","prior":"$136.2B","change":"+$46.8B (+34.4%)","current_label":"FY2026","prior_label":"FY2025"},{"metric":"Additions to property and equipment (capex)","current":"$115.9B","prior":"$64.6B","change":"+$51.4B (+79.6%)","current_label":"FY2026","prior_label":"FY2025"},{"metric":"Free cash flow","current":"$67.0B","prior":"$71.6B","change":"-$4.6B (-6.5%)","current_label":"FY2026","prior_label":"FY2025"},{"metric":"Net income","current":"$133.7B","prior":"$101.8B","change":"+$31.9B (+31.3%)","current_label":"FY2026","prior_label":"FY2025"},{"metric":"Capex as % of operating cash flow","current":"63.4%","prior":"47.4%","change":"+16.0 pp","current_label":"FY2026","prior_label":"FY2025"},{"metric":"Cash conversion (FCF / net income)","current":"0.50x","prior":"0.70x","change":"-0.20x","current_label":"FY2026","prior_label":"FY2025"},{"metric":"Free cash flow margin","current":"20.2%","prior":"25.4%","change":"-5.2 pp","current_label":"FY2026","prior_label":"FY2025"}],"statements":[{"text":"Operating cash flow increased $46.8B (+34.4%) to $182.9B; capex increased $51.4B (+79.6%) to $115.9B.","basis":"factual_observation","citations":[]},{"text":"Free cash flow (OCF \u2212 capex) decreased $4.6B (-6.5%) to $67.0B.","basis":"calculated_analysis","citations":[]},{"text":"63.4% of operating cash flow was reinvested in property and equipment (capex / OCF).","basis":"calculated_analysis","citations":[]},{"text":"Free cash flow was 0.50x net income (FCF / net income).","basis":"calculated_analysis","citations":[]},{"text":"FCF below net income can reflect heavy capital investment and non-cash gains in net income; the filing's cash-flow commentary should be read for the specific causes.","basis":"possible_interpretation","citations":[]},{"text":"\u201cCash from operations increased $46.8 billion to $182.9 billion for fiscal year 2026, primarily due to an increase in cash received from customers and a decrease in cash used to pay income taxes, offset in part by an increase in cash paid to suppliers. Cash used in financing increased $847 million to $52.5 billion for fiscal year 2026, primarily due to a $6.0 billion decrease in cash used for repayments of debt, offset in part by a $3.9 billion increase in common stock repurchases and a $2.4 billion increase in dividends paid. Cash used in investing increased $66.9 billion to $139.5 billion for fiscal year 2026, primarily due to a $51.4 billion increase in additions to property and equipment and a $22.2 billion increase in cash used in other investing primarily to facilitate the purchase of components, offset in part by a $4.2 billion decrease in cash used in the acquisition of \u2026\u201d","basis":"management_commentary","citations":["Microsoft FY2026 Form 10-K, Item 7. Management's Discussion and Analysis (MD&A) \u2013 LIQUIDITY AND CAPITAL RESOURCES \u203a Cash Flows, p.43"]}],"sources":[{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":53,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"CASH FLOWS STATEMENTS - Net cash from operations FY2026"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":53,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"CASH FLOWS STATEMENTS - Net cash from operations FY2025"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":53,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"CASH FLOWS STATEMENTS - Additions to property and equipment (capex) FY2026"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":53,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"CASH FLOWS STATEMENTS - Additions to property and equipment (capex) FY2025"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":50,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"INCOME STATEMENTS - Net income FY2026"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":50,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"INCOME STATEMENTS - Net income FY2025"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":50,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"INCOME STATEMENTS - Total revenue FY2026"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":50,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"INCOME STATEMENTS - Total revenue FY2025"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":53,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"CASH FLOWS STATEMENTS - Acquisitions, net of cash acquired, and purchases of intangible and other assets FY2026"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":53,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"CASH FLOWS STATEMENTS - Acquisitions, net of cash acquired, and purchases of intangible and other assets FY2025"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 7. Management's Discussion and Analysis (MD&A)","page":43,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"LIQUIDITY AND CAPITAL RESOURCES \u203a Cash Flows"}],"calculations":[{"name":"Free cash flow","fy":2026,"value":"$66.99B","formula":"Net cash from operations - Additions to property and equipment","inputs":"Net cash from operations FY2026 = 182,935.00 (USD millions, p.53); Additions to property and equipment (capex) FY2026 = 115,948.00 (USD millions, p.53)","status":"ok","proxy":false,"engine":"1.0.0"},{"name":"Capex as % of operating cash flow","fy":2026,"value":"63.38%","formula":"Additions to property and equipment / Net cash from operations","inputs":"Additions to property and equipment (capex) FY2026 = 115,948.00 (USD millions, p.53); Net cash from operations FY2026 = 182,935.00 (USD millions, p.53)","status":"ok","proxy":false,"engine":"1.0.0"},{"name":"Cash conversion (FCF / net income)","fy":2026,"value":"0.50x","formula":"(Net cash from operations - Capex) / Net income","inputs":"Net cash from operations FY2026 = 182,935.00 (USD millions, p.53); Additions to property and equipment (capex) FY2026 = 115,948.00 (USD millions, p.53); Net income FY2026 = 133,749.00 (USD millions, p.50)","status":"ok","proxy":false,"engine":"1.0.0"},{"name":"Free cash flow margin","fy":2026,"value":"20.19%","formula":"(Net cash from operations - Capex) / Revenue","inputs":"Net cash from operations FY2026 = 182,935.00 (USD millions, p.53); Additions to property and equipment (capex) FY2026 = 115,948.00 (USD millions, p.53); Total revenue FY2026 = 331,839.00 (USD millions, p.50)","status":"ok","proxy":false,"engine":"1.0.0"}],"tables":{},"audit_id":"bc1af39a-db74-4cb6-9b58-4bc808a4ace6","validation":"deterministic narrative"},{"question":"Is operating leverage improving?","group":"More","intent":"operating_leverage","title":"Revenue growth \u2192 operating income growth bridge, FY2026 vs FY2025","answer":"Revenue grew +17.8% while operating income grew +20.8% (operating leverage 1.17x). Operating income moved $26.7B to $155.2B. Gross profit added $31.6B (volume $34.5B, gross-margin-rate effect -$2.9B), while higher R&D, S&M and G&A absorbed $4.9B. Operating margin rose 1.2 pp to 46.8%: gross margin % contributed -0.9 pp and lower operating expenses as a share of revenue contributed +2.0 pp.","status":"ok","confidence":"High","basis":["Structured financial data","Management commentary","Calculated metric"],"disclaimer":"","key_numbers":[{"metric":"Operating income","current":"$155.2B","prior":"$128.5B","change":"+$26.7B (+20.8%)","current_label":"FY2026","prior_label":"FY2025"},{"metric":"Total revenue","current":"$331.8B","prior":"$281.7B","change":"+$50.1B (+17.8%)","current_label":"FY2026","prior_label":"FY2025"},{"metric":"Gross margin (gross profit)","current":"$225.5B","prior":"$193.9B","change":"+$31.6B (+16.3%)","current_label":"FY2026","prior_label":"FY2025"},{"metric":"Research and development","current":"$35.6B","prior":"$32.5B","change":"+$3.1B (+9.5%)","current_label":"FY2026","prior_label":"FY2025"},{"metric":"Sales and marketing","current":"$26.7B","prior":"$25.7B","change":"+$1.1B (+4.1%)","current_label":"FY2026","prior_label":"FY2025"},{"metric":"General and administrative","current":"$8.0B","prior":"$7.2B","change":"+$733M (+10.1%)","current_label":"FY2026","prior_label":"FY2025"},{"metric":"Operating margin %","current":"46.8%","prior":"45.6%","change":"+1.2 pp","current_label":"FY2026","prior_label":"FY2025"}],"statements":[{"text":"Gross margin (gross profit): $31.6B contribution to the change in operating income (118% of the change).","basis":"calculated_analysis","citations":[]},{"text":"  \u2013 Revenue growth at prior-year gross margin % (volume): $34.5B ((Revenue[t] - Revenue[t-1]) x GM%[t-1] = (331,839 - 281,724) x 68.82%).","basis":"calculated_analysis","citations":[]},{"text":"  \u2013 Change in gross margin % (rate / mix): -$2.9B ((GM%[t] - GM%[t-1]) x Revenue[t] = (67.94% - 68.82%) x 331,839).","basis":"calculated_analysis","citations":[]},{"text":"Research and development (cost increase reduces OI): -$3.1B contribution to the change in operating income (-12% of the change).","basis":"calculated_analysis","citations":[]},{"text":"Sales and marketing (cost increase reduces OI): -$1.1B contribution to the change in operating income (-4% of the change).","basis":"calculated_analysis","citations":[]},{"text":"General and administrative (cost increase reduces OI): -$733M contribution to the change in operating income (-3% of the change).","basis":"calculated_analysis","citations":[]},{"text":"Bridge reconciles: sum of drivers = 26,709 vs reported change 26,709.","basis":"calculated_analysis","citations":[]},{"text":"\u201cRevenue increased $50.1 billion or 18% driven by growth in Microsoft Cloud. Intelligent Cloud revenue increased driven by Azure. Productivity and Business Processes revenue increased driven by Microsoft 365 Commercial cloud. More Personal Computing revenue decreased driven by XBOX (formerly Gaming), offset in part by growth in Search advertising. Cost of revenue increased $18.5 billion or 21% driven by growth in Microsoft Cloud. Gross margin increased $31.6 billion or 16% with growth across each of our segments. Operating expenses increased $4.9 billion or 7% driven by continued investments in research and development compute capacity, AI talent, and data to support product development that benefits the entire portfolio, impairment and other related expenses in our XBOX business, investments in commercial sales, and higher Copilot advertising expenses. Operating income increased $26.7 \u2026\u201d","basis":"management_commentary","citations":["Microsoft FY2026 Form 10-K, Item 7. Management's Discussion and Analysis (MD&A) \u2013 SUMMARY RESULTS OF OPERATIONS \u203a Fiscal Year 2026 Compared with Fiscal Year 2025, p.37"]},{"text":"\u201cOperating income increased $220 million or 2%. Operating income included a favorable foreign currency impact of 2%.\u201d","basis":"management_commentary","citations":["Microsoft FY2026 Form 10-K, Item 7. Management's Discussion and Analysis (MD&A) \u2013 SEGMENT RESULTS OF OPERATIONS \u203a More Personal Computing, p.40"]},{"text":"Revenue grew +17.8% and operating income grew +20.8%; degree of operating leverage 1.17x (operating income grew faster than revenue).","basis":"calculated_analysis","citations":[]},{"text":"Identity: \u0394 operating margin = \u0394 gross margin % \u2212 \u0394 R&D% \u2212 \u0394 S&M% \u2212 \u0394 G&A% (all as % of revenue).","basis":"calculated_analysis","citations":[]},{"text":"Gross margin %: -0.9 pp impact on operating margin.","basis":"calculated_analysis","citations":[]},{"text":"R&D % of revenue: +0.8 pp impact on operating margin.","basis":"calculated_analysis","citations":[]},{"text":"S&M % of revenue: +1.1 pp impact on operating margin.","basis":"calculated_analysis","citations":[]},{"text":"G&A % of revenue: +0.2 pp impact on operating margin.","basis":"calculated_analysis","citations":[]},{"text":"Segment gross margin (segment revenue \u2212 segment cost of revenue): Intelligent Cloud moved -4.2 pp, the largest decline/smallest improvement among segments.","basis":"calculated_analysis","citations":[]},{"text":"A shift in revenue mix toward segments with different gross margins may also contribute to the consolidated change (largest segment by revenue: Productivity and Business Processes, 42%).","basis":"possible_interpretation","citations":[]},{"text":"\u201cSales and marketing expenses increased $1.1 billion or 4% driven by investments in commercial sales and higher Copilot advertising expenses.\u201d","basis":"management_commentary","citations":["Microsoft FY2026 Form 10-K, Item 7. Management's Discussion and Analysis (MD&A) \u2013 OPERATING EXPENSES \u203a Sales and Marketing \u203a Fiscal Year 2026 Compared with Fiscal Year 2025, p.40"]}],"sources":[{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":50,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"INCOME STATEMENTS - Operating income FY2026"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":50,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"INCOME STATEMENTS - Operating income FY2025"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":50,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"INCOME STATEMENTS - Total revenue FY2026"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":50,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"INCOME STATEMENTS - Total revenue FY2025"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":50,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"INCOME STATEMENTS - Gross margin (gross profit) FY2026"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":50,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"INCOME STATEMENTS - Gross margin (gross profit) FY2025"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":50,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"INCOME STATEMENTS - Research and development FY2026"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":50,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"INCOME STATEMENTS - Research and development FY2025"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":50,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"INCOME STATEMENTS - Sales and marketing FY2026"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":50,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"INCOME STATEMENTS - Sales and marketing FY2025"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":50,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"INCOME STATEMENTS - General and administrative FY2026"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":50,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"INCOME STATEMENTS - General and administrative FY2025"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 7. Management's Discussion and Analysis (MD&A)","page":37,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"SUMMARY RESULTS OF OPERATIONS \u203a Fiscal Year 2026 Compared with Fiscal Year 2025"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 7. Management's Discussion and Analysis (MD&A)","page":40,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"SEGMENT RESULTS OF OPERATIONS \u203a More Personal Computing"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 7. Management's Discussion and Analysis (MD&A)","page":40,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"OPERATING EXPENSES \u203a Sales and Marketing \u203a Fiscal Year 2026 Compared with Fiscal Year 2025"}],"calculations":[{"name":"Degree of operating leverage","fy":2026,"value":"1.17x","formula":"Operating income growth / Revenue growth","inputs":"Operating income FY2026 = 155,237.00 (USD millions, p.50); Operating income FY2025 = 128,528.00 (USD millions, p.50); Total revenue FY2026 = 331,839.00 (USD millions, p.50); Total revenue FY2025 = 281,724.00 (USD millions, p.50)","status":"ok","proxy":false,"engine":"1.0.0"}],"tables":{"operating_margin_decomposition":[{"driver":"Gross margin %","impact_pp":-0.008796},{"driver":"R&D % of revenue","impact_pp":0.008152},{"driver":"S&M % of revenue","impact_pp":0.01057},{"driver":"G&A % of revenue","impact_pp":0.001663},{"driver":"= Change in operating margin","impact_pp":0.011589}],"segment_gross_margin":[{"segment":"Intelligent Cloud","gross_margin_FY2026":0.579973,"gross_margin_FY2025":0.621973,"change_pp":-0.042001,"revenue_share":0.415234},{"segment":"More Personal Computing","gross_margin_FY2026":0.565585,"gross_margin_FY2025":0.53818,"change_pp":0.027405,"revenue_share":0.162886},{"segment":"Productivity and Business Processes","gross_margin_FY2026":0.821302,"gross_margin_FY2025":0.814403,"change_pp":0.006899,"revenue_share":0.421879}]},"audit_id":"115e8116-fc56-41e1-827a-a57b7ac659f8","validation":"deterministic narrative"},{"question":"What are the major opportunities visible from the financial data?","group":"More","intent":"opportunities","title":"Opportunities visible in the FY2026 financial data","answer":"The fastest-growing offerings were Server products and cloud services (+31.5%), Microsoft 365 Consumer products and cloud services (+23.9%), Microsoft 365 Commercial products and cloud services (+16.2%). Microsoft Cloud revenue increased $45.5B (+26.9%) to $214.4B.","status":"ok","confidence":"Medium","basis":["Structured financial data","Calculated metric","Inference","Management commentary"],"disclaimer":"","key_numbers":[{"metric":"Microsoft Cloud revenue","current":"$214.4B","prior":"$168.9B","change":"+$45.5B (+26.9%)","current_label":"FY2026","prior_label":"FY2025"},{"metric":"Server products and cloud services revenue","current":"$129.4B","prior":"$98.4B","change":"+$31.0B (+31.5%)","current_label":"FY2026","prior_label":"FY2025"},{"metric":"Microsoft 365 Consumer products and cloud services revenue","current":"$9.2B","prior":"$7.4B","change":"+$1.8B (+23.9%)","current_label":"FY2026","prior_label":"FY2025"},{"metric":"Microsoft 365 Commercial products and cloud services revenue","current":"$102.0B","prior":"$87.8B","change":"+$14.2B (+16.2%)","current_label":"FY2026","prior_label":"FY2025"}],"statements":[{"text":"Microsoft Cloud revenue increased $45.5B (+26.9%) to $214.4B.","basis":"factual_observation","citations":[]},{"text":"Server products and cloud services revenue increased $31.0B (+31.5%) to $129.4B.","basis":"calculated_analysis","citations":[]},{"text":"Microsoft 365 Consumer products and cloud services revenue increased $1.8B (+23.9%) to $9.2B.","basis":"calculated_analysis","citations":[]},{"text":"Microsoft 365 Commercial products and cloud services revenue increased $14.2B (+16.2%) to $102.0B.","basis":"calculated_analysis","citations":[]},{"text":"Degree of operating leverage 1.17x.","basis":"calculated_analysis","citations":[]},{"text":"Fast-growing offerings combined with positive operating leverage may indicate scope for continued margin support, subject to the capital intensity required to serve that growth.","basis":"possible_interpretation","citations":[]},{"text":"\u201cRemaining performance obligations represent the revenue we expect to recognize for our products and services for which control has not yet been transferred to customers. We estimate total consideration to be received at the outset of the agreement and throughout the term of the agreement. Estimating the total consideration and revenue that will be allocated to remaining performance obligation can involve significant judgments, including identifying and assessing variable consideration and potential renegotiation of commitments. We consider factors such as the nature of the terms and duration of the contract across our portfolio of contracts.\u201d","basis":"management_commentary","citations":["Microsoft FY2026 Form 10-K, Item 7. Management's Discussion and Analysis (MD&A) \u2013 CRITICAL ACCOUNTING ESTIMATES \u203a Revenue Recognition, p.46"]}],"sources":[{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":85,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"statement - Microsoft Cloud revenue FY2026"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":85,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20 cts and cloud services FY2026"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":85,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"Revenue, classified by significant product and service offerings, was as follows: - Revenue by product/service offering - Microsoft 365 Commercial products and cloud services FY2025"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":50,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"INCOME STATEMENTS - Operating income FY2026"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":50,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"INCOME STATEMENTS - Operating income FY2025"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":50,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"INCOME STATEMENTS - Total revenue FY2026"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":50,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"INCOME STATEMENTS - Total revenue FY2025"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 7. Management's Discussion and Analysis (MD&A)","page":46,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"CRITICAL ACCOUNTING ESTIMATES \u203a Revenue Recognition"}],"calculations":[{"name":"Degree of operating leverage","fy":2026,"value":"1.17x","formula":"Operating income growth / Revenue growth","inputs":"Operating income FY2026 = 155,237.00 (USD millions, p.50); Operating income FY2025 = 128,528.00 (USD millions, p.50); Total revenue FY2026 = 331,839.00 (USD millions, p.50); Total revenue FY2025 = 281,724.00 (USD millions, p.50)","status":"ok","proxy":false,"engine":"1.0.0"}],"tables":{"offering_growth":[{"offering":"Server products and cloud services","FY2026":129425.0,"FY2025":98435.0,"growth":0.314827},{"offering":"Microsoft 365 Consumer products and cloud services","FY2026":9175.0,"FY2025":7404.0,"growth":0.239195},{"offering":"Microsoft 365 Commercial products and cloud services","FY2026":101997.0,"FY2025":87767.0,"growth":0.162134},{"offering":"Dynamics products and cloud services","FY2026":9006.0,"FY2025":7827.0,"growth":0.150632},{"offering":"LinkedIn","FY2026":19817.0,"FY2025":17812.0,"growth":0.112565},{"offering":"Search advertising","FY2026":15176.0,"FY2025":13878.0,"growth":0.093529},{"offering":"Enterprise and partner services","FY2026":8260.0,"FY2025":7760.0,"growth":0.064433},{"offering":"Windows and Devices","FY2026":17084.0,"FY2025":17314.0,"growth":-0.013284},{"offering":"XBOX","FY2026":21790.0,"FY2025":23455.0,"growth":-0.070987}]},"audit_id":"b6ce770b-6839-44b5-b66d-a95c4c5d656e","validation":"deterministic narrative"},{"question":"What will revenue be next year?","group":"More","intent":"forecast_request","title":"Forecast request","answer":"The public filings do not contain a forecast I can rely on, and this system does not generate predictions. I can run an illustrative scenario instead (e.g. 'Run a scenario where revenue growth is 5 percentage points lower').","status":"refused","confidence":"High","basis":["Governance control"],"disclaimer":"","key_numbers":[],"statements":[{"text":"Hallucination control: forecasts and management intentions are never generated.","basis":"calculated_analysis","citations":[]}],"sources":[],"calculations":[],"tables":{},"audit_id":"f0da2976-bb62-4ac1-a8dd-f5c1e3a52f42","validation":"deterministic narrative"},{"question":"How did revenue change year over year?","group":"More","intent":"metric_change","title":"Total revenue - FY2026 vs FY2025","answer":"Total revenue increased $50.1B (+17.8%) to $331.8B in FY2026 versus FY2025.","status":"ok","confidence":"High","basis":["Structured financial data","Calculated metric","Management commentary"],"disclaimer":"","key_numbers":[{"metric":"Total revenue","current":"$331.8B","prior":"$281.7B","change":"+$50.1B (+17.8%)","current_label":"FY2026","prior_label":"FY2025"}],"statements":[{"text":"Total revenue increased $50.1B (+17.8%) to $331.8B in FY2026 (FY2025: $281.7B).","basis":"factual_observation","citations":[]},{"text":"Total revenue CAGR FY2023-FY2026: 16.1% (compound annual growth).","basis":"calculated_analysis","citations":[]},{"text":"\u201cRevenue increased $50.1 billion or 18% driven by growth in Microsoft Cloud. Intelligent Cloud revenue increased driven by Azure. Productivity and Business Processes revenue increased driven by Microsoft 365 Commercial cloud. More Personal Computing revenue decreased driven by XBOX (formerly Gaming), offset in part by growth in Search advertising. Cost of revenue increased $18.5 billion or 21% driven by growth in Microsoft Cloud. Gross margin increased $31.6 billion or 16% with growth across each of our segments. Operating expenses increased $4.9 billion or 7% driven by continued investments in research and development compute capacity, AI talent, and data to support product development that benefits the entire portfolio, impairment and other related expenses in our XBOX business, investments in commercial sales, and higher Copilot advertising expenses. Operating income increased $26.7 \u2026\u201d","basis":"management_commentary","citations":["Microsoft FY2026 Form 10-K, Item 7. Management's Discussion and Analysis (MD&A) \u2013 SUMMARY RESULTS OF OPERATIONS \u203a Fiscal Year 2026 Compared with Fiscal Year 2025, p.37"]}],"sources":[{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":50,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"INCOME STATEMENTS - Total revenue FY2026"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":50,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"INCOME STATEMENTS - Total revenue FY2025"},{"document":"Microsoft FY2025 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":50,"url":"https://www.sec.gov/Archives/edgar/data/789019/000095017025100235/msft-20250630.htm","detail":"INCOME STATEMENTS - Total revenue FY2023"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 7. Management's Discussion and Analysis (MD&A)","page":37,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"SUMMARY RESULTS OF OPERATIONS \u203a Fiscal Year 2026 Compared with Fiscal Year 2025"}],"calculations":[{"name":"Total revenue CAGR FY2023-FY2026","fy":2026,"value":"16.12%","formula":"(Value FY2026 / Value FY2023)^(1/3) - 1","inputs":"(331,839 / 211,915)^(1/3) - 1","status":"ok","proxy":false,"engine":"1.0.0"}],"tables":{},"audit_id":"43d25fc8-cee3-44ed-8087-614a1853dd01","validation":"deterministic narrative"},{"question":"Is operating leverage improving?","group":"More","intent":"operating_leverage","title":"Revenue growth \u2192 operating income growth bridge, FY2026 vs FY2025","answer":"Revenue grew +17.8% while operating income grew +20.8% (operating leverage 1.17x). Operating income moved $26.7B to $155.2B. Gross profit added $31.6B (volume $34.5B, gross-margin-rate effect -$2.9B), while higher R&D, S&M and G&A absorbed $4.9B. Operating margin rose 1.2 pp to 46.8%: gross margin % contributed -0.9 pp and lower operating expenses as a share of revenue contributed +2.0 pp.","status":"ok","confidence":"High","basis":["Structured financial data","Management commentary","Calculated metric"],"disclaimer":"","key_numbers":[{"metric":"Operating income","current":"$155.2B","prior":"$128.5B","change":"+$26.7B (+20.8%)","current_label":"FY2026","prior_label":"FY2025"},{"metric":"Total revenue","current":"$331.8B","prior":"$281.7B","change":"+$50.1B (+17.8%)","current_label":"FY2026","prior_label":"FY2025"},{"metric":"Gross margin (gross profit)","current":"$225.5B","prior":"$193.9B","change":"+$31.6B (+16.3%)","current_label":"FY2026","prior_label":"FY2025"},{"metric":"Research and development","current":"$35.6B","prior":"$32.5B","change":"+$3.1B (+9.5%)","current_label":"FY2026","prior_label":"FY2025"},{"metric":"Sales and marketing","current":"$26.7B","prior":"$25.7B","change":"+$1.1B (+4.1%)","current_label":"FY2026","prior_label":"FY2025"},{"metric":"General and administrative","current":"$8.0B","prior":"$7.2B","change":"+$733M (+10.1%)","current_label":"FY2026","prior_label":"FY2025"},{"metric":"Operating margin %","current":"46.8%","prior":"45.6%","change":"+1.2 pp","current_label":"FY2026","prior_label":"FY2025"}],"statements":[{"text":"Gross margin (gross profit): $31.6B contribution to the change in operating income (118% of the change).","basis":"calculated_analysis","citations":[]},{"text":"  \u2013 Revenue growth at prior-year gross margin % (volume): $34.5B ((Revenue[t] - Revenue[t-1]) x GM%[t-1] = (331,839 - 281,724) x 68.82%).","basis":"calculated_analysis","citations":[]},{"text":"  \u2013 Change in gross margin % (rate / mix): -$2.9B ((GM%[t] - GM%[t-1]) x Revenue[t] = (67.94% - 68.82%) x 331,839).","basis":"calculated_analysis","citations":[]},{"text":"Research and development (cost increase reduces OI): -$3.1B contribution to the change in operating income (-12% of the change).","basis":"calculated_analysis","citations":[]},{"text":"Sales and marketing (cost increase reduces OI): -$1.1B contribution to the change in operating income (-4% of the change).","basis":"calculated_analysis","citations":[]},{"text":"General and administrative (cost increase reduces OI): -$733M contribution to the change in operating income (-3% of the change).","basis":"calculated_analysis","citations":[]},{"text":"Bridge reconciles: sum of drivers = 26,709 vs reported change 26,709.","basis":"calculated_analysis","citations":[]},{"text":"\u201cRevenue increased $50.1 billion or 18% driven by growth in Microsoft Cloud. Intelligent Cloud revenue increased driven by Azure. Productivity and Business Processes revenue increased driven by Microsoft 365 Commercial cloud. More Personal Computing revenue decreased driven by XBOX (formerly Gaming), offset in part by growth in Search advertising. Cost of revenue increased $18.5 billion or 21% driven by growth in Microsoft Cloud. Gross margin increased $31.6 billion or 16% with growth across each of our segments. Operating expenses increased $4.9 billion or 7% driven by continued investments in research and development compute capacity, AI talent, and data to support product development that benefits the entire portfolio, impairment and other related expenses in our XBOX business, investments in commercial sales, and higher Copilot advertising expenses. Operating income increased $26.7 \u2026\u201d","basis":"management_commentary","citations":["Microsoft FY2026 Form 10-K, Item 7. Management's Discussion and Analysis (MD&A) \u2013 SUMMARY RESULTS OF OPERATIONS \u203a Fiscal Year 2026 Compared with Fiscal Year 2025, p.37"]},{"text":"\u201cOperating income increased $220 million or 2%. Operating income included a favorable foreign currency impact of 2%.\u201d","basis":"management_commentary","citations":["Microsoft FY2026 Form 10-K, Item 7. Management's Discussion and Analysis (MD&A) \u2013 SEGMENT RESULTS OF OPERATIONS \u203a More Personal Computing, p.40"]},{"text":"Revenue grew +17.8% and operating income grew +20.8%; degree of operating leverage 1.17x (operating income grew faster than revenue).","basis":"calculated_analysis","citations":[]},{"text":"Identity: \u0394 operating margin = \u0394 gross margin % \u2212 \u0394 R&D% \u2212 \u0394 S&M% \u2212 \u0394 G&A% (all as % of revenue).","basis":"calculated_analysis","citations":[]},{"text":"Gross margin %: -0.9 pp impact on operating margin.","basis":"calculated_analysis","citations":[]},{"text":"R&D % of revenue: +0.8 pp impact on operating margin.","basis":"calculated_analysis","citations":[]},{"text":"S&M % of revenue: +1.1 pp impact on operating margin.","basis":"calculated_analysis","citations":[]},{"text":"G&A % of revenue: +0.2 pp impact on operating margin.","basis":"calculated_analysis","citations":[]},{"text":"Segment gross margin (segment revenue \u2212 segment cost of revenue): Intelligent Cloud moved -4.2 pp, the largest decline/smallest improvement among segments.","basis":"calculated_analysis","citations":[]},{"text":"A shift in revenue mix toward segments with different gross margins may also contribute to the consolidated change (largest segment by revenue: Productivity and Business Processes, 42%).","basis":"possible_interpretation","citations":[]},{"text":"\u201cSales and marketing expenses increased $1.1 billion or 4% driven by investments in commercial sales and higher Copilot advertising expenses.\u201d","basis":"management_commentary","citations":["Microsoft FY2026 Form 10-K, Item 7. Management's Discussion and Analysis (MD&A) \u2013 OPERATING EXPENSES \u203a Sales and Marketing \u203a Fiscal Year 2026 Compared with Fiscal Year 2025, p.40"]}],"sources":[{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":50,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"INCOME STATEMENTS - Operating income FY2026"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":50,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"INCOME STATEMENTS - Operating income FY2025"},{"document":"Microsoft FY2026 Form 10-K","sectio osition":[{"driver":"Gross margin %","impact_pp":-0.008796},{"driver":"R&D % of revenue","impact_pp":0.008152},{"driver":"S&M % of revenue","impact_pp":0.01057},{"driver":"G&A % of revenue","impact_pp":0.001663},{"driver":"= Change in operating margin","impact_pp":0.011589}],"segment_gross_margin":[{"segment":"Intelligent Cloud","gross_margin_FY2026":0.579973,"gross_margin_FY2025":0.621973,"change_pp":-0.042001,"revenue_share":0.415234},{"segment":"More Personal Computing","gross_margin_FY2026":0.565585,"gross_margin_FY2025":0.53818,"change_pp":0.027405,"revenue_share":0.162886},{"segment":"Productivity and Business Processes","gross_margin_FY2026":0.821302,"gross_margin_FY2025":0.814403,"change_pp":0.006899,"revenue_share":0.421879}]},"audit_id":"ce79d836-5c8c-4d8f-9c1c-34290cb18e7e","validation":"deterministic narrative"},{"question":"Which segment is growing fastest?","group":"More","intent":"segment","title":"Segment analysis FY2026 vs FY2025","answer":"Intelligent Cloud grew fastest (+29.7%); More Personal Computing grew slowest (-1.1%).","status":"ok","confidence":"High","basis":["Structured financial data","Management commentary"],"disclaimer":"","key_numbers":[{"metric":"Intelligent Cloud revenue","current":"$137.8B","prior":"$106.3B","change":"+$31.5B (+29.7%)","current_label":"FY2026","prior_label":"FY2025"},{"metric":"More Personal Computing revenue","current":"$54.1B","prior":"$54.6B","change":"-$597M (-1.1%)","current_label":"FY2026","prior_label":"FY2025"},{"metric":"Productivity and Business Processes revenue","current":"$140.0B","prior":"$120.8B","change":"+$19.2B (+15.9%)","current_label":"FY2026","prior_label":"FY2025"},{"metric":"Total revenue","current":"$331.8B","prior":"$281.7B","change":"+$50.1B (+17.8%)","current_label":"FY2026","prior_label":"FY2025"}],"statements":[{"text":"Intelligent Cloud: revenue $137.8B (+29.7%), contributed 63% of total revenue growth (+11.2 pp of the +17.8%); operating margin 41.3% (FY2025: 42.0%).","basis":"calculated_analysis","citations":[]},{"text":"More Personal Computing: revenue $54.1B (-1.1%), contributed -1% of total revenue growth (-0.2 pp of the +17.8%); operating margin 26.6% (FY2025: 25.9%).","basis":"calculated_analysis","citations":[]},{"text":"Productivity and Business Processes: revenue $140.0B (+15.9%), contributed 38% of total revenue growth (+6.8 pp of the +17.8%); operating margin 59.9% (FY2025: 57.8%).","basis":"calculated_analysis","citations":[]},{"text":"Rankings use explicit definitions: contribution = segment \u0394revenue / total \u0394revenue; growth = segment revenue YoY %; margin = segment operating income / segment revenue. No subjective 'performance' score is applied.","basis":"calculated_analysis","citations":[]},{"text":"Within Intelligent Cloud, the largest revenue increase came from Server products and cloud services ($31.0B).","basis":"calculated_analysis","citations":[]},{"text":"Within Productivity and Business Processes, the largest revenue increase came from Microsoft 365 Commercial products and cloud services ($14.2B).","basis":"calculated_analysis","citations":[]},{"text":"Within More Personal Computing, the largest revenue increase came from Search advertising ($1.3B).","basis":"calculated_analysis","citations":[]},{"text":"\u201cRevenue increased $50.1 billion or 18% driven by growth in Microsoft Cloud. Intelligent Cloud revenue increased driven by Azure. Productivity and Business Processes revenue increased driven by Microsoft 365 Commercial cloud. More Personal Computing revenue decreased driven by XBOX (formerly Gaming), offset in part by growth in Search advertising. Cost of revenue increased $18.5 billion or 21% driven by growth in Microsoft Cloud. Gross margin increased $31.6 billion or 16% with growth across each of our segments. Operating expenses increased $4.9 billion or 7% driven by continued investments in research and development compute capacity, AI talent, and data to support product development that benefits the entire portfolio, impairment and other related expenses in our XBOX business, investments in commercial sales, and higher Copilot advertising expenses. Operating income increased $26.7 \u2026\u201d","basis":"management_commentary","citations":["Microsoft FY2026 Form 10-K, Item 7. Management's Discussion and Analysis (MD&A) \u2013 SUMMARY RESULTS OF OPERATIONS \u203a Fiscal Year 2026 Compared with Fiscal Year 2025, p.37"]},{"text":"\u201cSales and marketing expenses increased $1.1 billion or 4% driven by investments in commercial sales and higher Copilot advertising expenses.\u201d","basis":"management_commentary","citations":["Microsoft FY2026 Form 10-K, Item 7. Management's Discussion and Analysis (MD&A) \u2013 OPERATING EXPENSES \u203a Sales and Marketing \u203a Fiscal Year 2026 Compared with Fiscal Year 2025, p.40"]}],"sources":[{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":84,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"Segment revenue, cost of revenue, operating expenses, and operating income were as follows during the periods presented: - Segment revenue - Intelligent Cloud FY2026"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":84,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"Segment revenue, cost of revenue, operating expenses, and operating income were as follows during the periods presented: - Segment revenue - Intelligent Cloud FY2025"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":84,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"Segment revenue, cost of revenue, operating expenses, and operating income were as follows during the periods presented: - Segment operating income - Intelligent Cloud FY202 pment compute capacity, AI talent, and data to support product development that benefits the entire portfolio, impairment and other related expenses in our XBOX business, investments in commercial sales, and higher Copilot advertising expenses. Operating income increased $26.7 \u2026\u201d","basis":"management_commentary","citations":["Microsoft FY2026 Form 10-K, Item 7. Management's Discussion and Analysis (MD&A) \u2013 SUMMARY RESULTS OF OPERATIONS \u203a Fiscal Year 2026 Compared with Fiscal Year 2025, p.37"]},{"text":"\u201cResearch and development expenses increased $3.1 billion or 9% driven by continued investments in compute capacity, AI talent, and data to support product development that benefits the entire portfolio, as well as impairment and other related expenses in our XBOX business.\u201d","basis":"management_commentary","citations":["Microsoft FY2026 Form 10-K, Item 7. Management's Discussion and Analysis (MD&A) \u2013 OPERATING EXPENSES \u203a Research and Development \u203a Fiscal Year 2026 Compared with Fiscal Year 2025, p.40"]}],"sources":[{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":50,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"INCOME STATEMENTS - Cost of revenue - service and other FY2026"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":50,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"INCOME STATEMENTS - Cost of revenue - service and other FY2025"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":50,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"INCOME STATEMENTS - Research and development FY2026"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Suppl  \u203a Fiscal Year 2026 Compared with Fiscal Year 2025, p.37"]},{"text":"Research and development increased $3.1B (+9.5%) to $35.6B in FY2026 (FY2025: $32.5B).","basis":"factual_observation","citations":[]},{"text":"Research and development CAGR FY2023-FY2026: 9.4% (compound annual growth).","basis":"calculated_analysis","citations":[]},{"text":"R&D as % of revenue fell 0.8 pp to 10.7%.","basis":"calculated_analysis","citations":[]},{"text":"\u201cResearch and development expenses increased $3.1 billion or 9% driven by continued investments in compute capacity, AI talent, and data to support product development that benefits the entire portfolio, as well as impairment and other related expenses in our XBOX business.\u201d","basis":"management_commentary","citations":["Microsoft FY2026 Form 10-K, Item 7. Management's Discussion and Analysis (MD&A) \u2013 OPERATING EXPENSES \u203a Research and Development \u203a Fiscal Year 2026 Compared with Fiscal Year 2025, p.40"]}],"sources":[{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":50,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"INCOME STATEMENTS - Total revenue FY2026"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":50,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"INCOME STATEMENTS - Total revenue FY2025"},{"document":"Microsoft FY2025 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":50,"url":"https://www.sec.gov/Archives/edgar/data/789019/000095017025100235/msft-20250630.htm","detail":"INCOME STATEMENTS - Total revenue FY2023"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 7. Management's Discussion and Analysis (MD&A)","page":37,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"SUMMARY R :[]},{"text":"Productivity and Business Processes: revenue $140.0B (+15.9%), contributed 38% of total revenue growth (+6.8 pp of the +17.8%); operating margin 59.9% (FY2025: 57.8%).","basis":"calculated_analysis","citations":[]},{"text":"Rankings use explicit definitions: contribution = segment \u0394revenue / total \u0394revenue; growth = segment revenue YoY %; margin = segment operating income / segment revenue. No subjective 'performance' score is applied.","basis":"calculated_analysis","citations":[]},{"text":"Within Intelligent Cloud, the largest revenue increase came from Server products and cloud services ($31.0B).","basis":"calculated_analysis","citations":[]},{"text":"Within Productivity and Business Processes, the largest revenue increase came from Microsoft 365 Commercial products and cloud services ($14.2B).","basis":"calculated_analysis","citations":[]},{"text":"Within More Personal Computing, the largest revenue increase came from Search advertising ($1.3B).","basis":"calculated_analysis","citations":[]},{"text":"\u201cRevenue increased $50.1 billion or 18% driven by growth in Microsoft Cloud. Intelligent Cloud revenue increased driven by Azure. Productivity and Business Processes revenue increased driven by Microsoft 365 Commercial cloud. More Personal Computing revenue decreased driven by XBOX (formerly Gaming), offset in part by growth in Search advertising. Cost of revenue increased $18.5 billion or 21% driven by growth in Microsoft Cloud. Gross margin increased $31.6 billion or 16% with growth across each of our segments. Operating expenses increased $4.9 billion or 7% driven by continued investments in research and development compute capacity, AI talent, and data to support product development that benefits the entire portfolio, impairment and other related expenses in our XBOX business, investments in commercial sales, and higher Copilot advertising expenses. Operating income increased $26.7 \u2026\u201d","basis":"management_commentary","citations":["Microsoft FY2026 Form 10-K, Item 7. Management's Discussion and Analysis (MD&A) \u2013 SUMMARY RESULTS OF OPERATIONS \u203a Fiscal Year 2026 Compared with Fiscal Year 2025, p.37"]},{"text":"\u201cSales and marketing expenses increased $1.1 billion or 4% driven by investments in commercial sales and higher Copilot advertising expenses.\u201d","basis":"management_commentary","citations":["Microsoft FY2026 Form 10-K, Item 7. Management's Discussion and Analysis (MD&A) \u2013 OPERATING EXPENSES \u203a Sales and Marketing \u203a Fiscal Year 2026 Compared with Fiscal Year 2025, p.40"]}],"sources":[{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":84,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"Segment revenue, cost of revenue, operating expenses, and operating income were as follows during the periods presented: - Segment revenue - Intelligent Cloud FY2026"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":84,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"Segment revenue, cost of revenue, operating expenses, and operating income were as follows during the periods presented: - Segment revenue - Intelligent Cloud FY2025"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":84,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"Segment revenue, cost of revenue, operating expenses, and operating income were as follows during the periods presented: - Segment operating income - Intelligent Cloud FY2026"},{"document":"Microsoft FY2026 Form 10-K","section":"Item 8. Financial Statements and Supplementary Data","page":84,"url":"https://www.sec.gov/Archives/edgar/data/789019/000119312526323660/msft-20260630.htm","detail":"Segment reven function fv(v, unit="USD millions", d=1){
  if (v === null || v === undefined || Number.isNaN(v)) return "n/a";
  if (unit === "%") return (v*100).toFixed(d) + "%";
  if (unit === "pp") return (v>=0?"+":"") + (v*100).toFixed(d) + " pp";
  if (unit === "x") return v.toFixed(2) + "x";
  if (unit === "USD millions"){ const s=v<0?"-":""; const a=Math.abs(v); return a>=1000 ? `${s}$${(a/1000).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d})}B` : `${s}$${Math.round(a).toLocaleString("en-US")}M`; }
  if (unit === "USD thousands") return "$" + Math.round(v).toLocaleString("en-US") + "K";
  if (unit === "USD per share") return "$" + v.toFixed(2);
  if (unit === "people") return Math.round(v).toLocaleString("en-US");
  return v.toLocaleString("en-US",{maximumFractionDigits:d}) + " " + unit;

function barChart(series, {pctMode=false, h=220}={}){
  const names = Object.keys(series); const years = [...new Set(names.flatMap(n=>Object.keys(series[n])))].sort();
  const vals = names.flatMap(n=>years.map(y=>series[n][y] ?? 0)).map(v => pctMode ? v : v/1000);
  const max = niceMax(Math.max(...vals,0)); const W=560, L=40, R=8, T=10, B=24, ih=h-T-B, iw=W-L-R;

function sparkline(series){

function respCard(r, note){

  const groups = Object.entries(BASIS).map(([b,[label,color]])=>{
    const items = (r.statements||[]).filter(s=>s.basis===b); if(!items.length) return "";
    return `<div class="basis-group"><span class="pill" style="color:${color}"><i></i>${label}</span><ul>${items.map(s=>{
      const indent = /^\s+–/.test(s.text); const txt = s.text.replace(/^\s+–\s*/,"");

  }).join("");
  const src = r.sources?.length ? `<div class="blk src"><div class="lbl">Source</div><div class="tbl"><table><thead><tr><th>Document</th><th>Section</th><th class="n">Page</th><th>Item</th><th>Link</th></tr></thead><tbody>
    ${r.sources.map(s=>`<tr><td>${esc(s.document)}</td><td>${esc(s.section)}</td><td class="n">${esc(s.page)}</td><td>${esc(s.detail)}</td><td>${s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener">SEC ↗</a>`:""}</td></tr>`).join("")}</tbody></table></div></div>` : "";
  const calcs = r.calculations?.length ? `<details><summary>Calculations (${r.calculations.length}) · formula, inputs, page, engine version</summary><div class="inner tbl"><table><thead><tr><th>Metric</th><th class="n">FY</th><th class="n">Result</th><th>Formula</th><th>Inputs (value, unit, page)</th></tr></thead><tbody>
    ${r.calculations.map(c=>`<tr><td>${esc(c.name)}${c.proxy?' <span class="tag neu">proxy</span>':""}</td><td class="n">${esc(c.fy)}</td><td class="n">${esc(c.value)}</td><td class="mono small">${esc(c.formula)}</td><td class="small">${esc(c.inputs||"")}</td></tr>`).join("")}</tbody></table></div></details>` : "";
  const tables = Object.entries(r.tables||{}).filter(([,rows])=>rows&&rows.length).map(([name,rows])=>{
    const cols = Object.keys(rows[0]);
    const cell = v => typeof v==="number" ? (Math.abs(v)<=1.5 && !Number.isInteger(v) ? (v*100).toFixed(1)+"%" : Math.abs(v)>=1000 ? fv(v) : v.toLocaleString("en-US",{maximumFractionDigits:2})) : esc(v);
    return `<div class="lbl" style="margin-top:10px">${esc(name.replace(/_/g," "))}</div><div class="tbl"><table><thead><tr>${cols.map(c=>`<th>${esc(c.replace(/_/g," "))}</th>`).join("")}</tr></thead><tbody>${rows.map(row=>`<tr>${cols.map(c=>`<td class="${typeof row[c]==="number"?"n":""}">${cell(row[c])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  }).join("");
  return `<article class="panel resp">
    <div class="hd"><h3>${esc(r.title)}</h3><span class="muted small mono">intent ${esc(r.intent)}${r.audit_id?` · audit ${esc(r.audit_id.slice(0,8))}`:""}</span></div>
    <div class="blk"><div class="lbl">Answer</div><div class="answer">${esc(r.answer)}</div>
      ${r.disclaimer?`<div class="disc">⚠ ${esc(r.disclaimer)}</div>`:""}

      ${note?`<div class="meta">${note}</div>`:""}</div>

const STOP = new Set("the a an of in to and is was did does do how what which why for on by with has have are be this that it its me show from company s i my our".split(" "));
const norm = q => q.toLowerCase().replace(/r&d/g,"research development").replace(/capex/g,"capital expenditure").replace(/fcf/g,"free cash flow").replace(/opex/g,"operating expenses").replace(/[^a-z0-9% ]+/g," ").split(/\s+/).filter(w=>w&&!STOP.has(w));
function match(q){
  const a = new Set(norm(q)); let best=null, bs=0;
  DATA.responses.forEach(r=>{ if(/^show /i.test(r.question)) return; const b=new Set(norm(r.question)); const inter=[...a].filter(x=>b.has(x)).length; const s=inter/(new Set([...a,...b]).size||1); if(s>bs){bs=s;best=r;} });
  return bs>=0.34 ? best : null;
}
function parseShock(q){
  const s=q.toLowerCase(); const out={};
  const names=[["revenue growth","revenue_growth"],["gross margin","gross_margin"],["r&d","rd_growth"],["research and development","rd_growth"],["tax rate","tax_rate"],["capex","capex_intensity"],["capital expenditure","capex_intensity"]];
  names.forEach(([p,k])=>{ const i=s.indexOf(p); if(i<0) return; const seg=s.slice(i,i+80);
    let m=seg.match(/(\d+(?:\.\d+)?)\s*(?:percentage points?|pp|points?|%)\s*(lower|higher|less|more|down|up)/);
    if(m){ out[k]=(/lower|less|down/.test(m[2])?-1:1)*parseFloat(m[1])/100; return; }
    m=seg.match(/(decreas|declin|fall|drop|reduc|lower|increas|rise|higher)\w*\s+(?:by\s+)?(\d+(?:\.\d+)?)\s*(?:percentage points?|pp|points?|%)/);
    if(m) out[k]=(/^(decreas|declin|fall|drop|reduc|lower)/.test(m[1])?-1:1)*parseFloat(m[2])/100; });
  return out;
}
function answerFor(q){
  const s=q.toLowerCase().trim();
  if(/how (did|do) you (calculate|compute)|how you calculated|show (me )?the (calculation|formula)/.test(s)){
    if(!lastAnswer) return {r:{title:"No previous answer",intent:"show_calculation",answer:"Ask a question first, then ask how it was calculated.",confidence:"High",basis:["Session context"]}};
    const p=lastAnswer; return {r:{...p,intent:"show_calculation",title:"How it was calculated: "+p.title,answer:`The previous answer used ${p.calculations?.length||0} deterministic calculation(s) and ${p.sources?.length||0} cited source location(s). Every formula and input with its filing page is listed below.`,
      statements:(p.calculations||[]).map(c=>({basis:"calculated_analysis",text:`${c.name} FY${c.fy} = ${c.value} | formula: ${c.formula} | inputs: ${c.inputs||"n/a"} | engine v${c.engine}`,citations:[]})), key_numbers:[]}, note:"Follow-up answered from the previous response in this session."};
  }
  if(/^\W*(now,? |and |ok,? )?(show (me )?(the )?(source|evidence)|where (does|did) (this|that))|evidence behind/.test(s)){
    if(!lastAnswer) return {r:{title:"Source registry",intent:"show_source",answer:"These are the public sources loaded into the model.",confidence:"High",basis:["Source registry"],sources:DATA.sources.map(x=>({document:x.short_name,section:x.source_type,page:"-",detail:x.reporting_period,url:x.source_url}))}};
    const p=lastAnswer; return {r:{...p,intent:"show_source",title:"Evidence for: "+p.title,answer:`Every number in the previous answer comes from ${p.sources?.length||0} cited source location(s), listed below with page references.`,statements:(p.statements||[]).filter(x=>x.basis!=="possible_interpretation")}, note:"Follow-up answered from the previous response in this session."};
  }
  if(/\b(forecast|predict|guidance for|next year's (revenue|earnings)|will (revenue|earnings|profit|margin)s? (be|grow))\b/.test(s))
    return {r:DATA.responses.find(r=>r.intent==="forecast_request")};
  if(/scenario|assume|what if|suppose|simulate/.test(s)){
    const shocks=parseShock(q);
    if(Object.keys(shocks).length){ const known=DATA.responses.find(r=>r.intent==="scenario"&&JSON.stringify(parseShock(r.question))===JSON.stringify(shocks)); if(known) return {r:known};
      return {r:scenarioAnswer(shocks), note:"Computed live in this page with the documented scenario formulas (same inputs as the Python engine)."}; }
  }
  const m=match(q); if(m) return {r:m, note: m.question.toLowerCase()===s?"":`Matched to library question: “${esc(m.question)}”.`};
  return {r:{title:"Not in the evidence",intent:"not_found",status:"insufficient_evidence",answer:"I could not find sufficient evidence in the available public filings. This static edition answers the question library on the left and any scenario (e.g. “What if gross margin is 2 percentage points lower?”). The full Python app also searches the filing text.",confidence:"Low",basis:[]}};
}

const S = DATA.scenario;
function runScenario(a){
  const rev=S.revenue*(1+a.revenue_growth), gp=rev*a.gross_margin, rd=S.rd*(1+a.rd_growth), sm=S.sm*(1+a.sm_growth), ga=S.ga*(1+a.ga_growth);
  const oi=gp-rd-sm-ga, pbt=oi+a.other_income, ni=pbt*(1-a.tax_rate), ocf=ni*a.ocf_to_net_income, capex=rev*a.capex_intensity;
  return {revenue:rev,gross_profit:gp,research_and_development:rd,sales_and_marketing:sm,general_and_administrative:ga,operating_income:oi,operating_margin:oi/rev,income_before_tax:pbt,net_income:ni,operating_cash_flow:ocf,capital_expenditure:capex,free_cash_flow:ocf-capex};
}
function scenarioAnswer(shocks){
  const a={...S.assumptions}; Object.entries(shocks).forEach(([k,v])=>a[k]+=v);
  const b=runScenario(S.assumptions), s=runScenario(a), d=k=>s[k]-b[k];
  const lines=["revenue","gross_profit","operating_income","operating_margin","net_income","operating_cash_flow","capital_expenditure","free_cash_flow"];
  const txt=Object.entries(shocks).map(([k,v])=>`${k} ${(v*100>=0?"+":"")+(v*100).toFixed(1)} pp`).join(", ");
  return {title:`Illustrative scenario · FY${S.base_year+1} vs base case`,intent:"scenario",confidence:"Medium",basis:["Calculated metric","Scenario model (illustrative)"],disclaimer:S.disclaimer,
    answer:`${S.disclaimer} With ${txt} (other assumptions at FY${S.base_year} actual ratios), illustrative FY${S.base_year+1} operating income would be ${fv(s.operating_income)}, ${signed(d("operating_income"))} (${pct(d("operating_income")/b.operating_income)}) versus the base case; free cash flow would change by ${signed(d("free_cash_flow"))}.`,
    key_numbers:lines.map(k=>({metric:k.replace(/_/g," ").replace(/^./,c=>c.toUpperCase()),current:k==="operating_margin"?fv(s[k],"%"):fv(s[k]),prior:k==="operating_margin"?fv(b[k],"%"):fv(b[k]),change:k==="operating_margin"?fv(d(k),"pp"):`${signed(d(k))} (${pct(d(k)/Math.abs(b[k]))})`,current_label:`Scenario FY${S.base_year+1}E`,prior_label:"Base case"})),
    statements:[{basis:"calculated_analysis",text:`Shock applied: ${txt}. All other assumptions held at FY${S.base_year} actual ratios.`,citations:[]},{basis:"possible_interpretation",text:S.disclaimer+" The base case mechanically carries forward actual ratios; it is not a forecast.",citations:[]}]};
}
function sensitivity(target){
  const shocks={revenue_growth:.01,gross_margin:.01,rd_growth:.01,sm_growth:.01,ga_growth:.01,tax_rate:.01,capex_intensity:.01,ocf_to_net_income:.05};
  const base=runScenario(S.assumptions)[target];
  return Object.entries(shocks).map(([k,sh])=>{const u={...S.assumptions},dn={...S.assumptions}; u[k]+=sh; dn[k]-=sh; return {label:k.replace(/_/g," "),shock:k==="ocf_to_net_income"?"±0.05x":"±1 pp",up:runScenario(u)[target]-base,down:runScenario(dn)[target]-base};})
    .sort((x,y)=>Math.max(Math.abs(y.up),Math.abs(y.down))-Math.max(Math.abs(x.up),Math.abs(x.down)));
}

    <div class="grid g2" style="margin-top:14px">
      <div class="panel tbl" id="outTbl"></div>
      <div class="panel pad"><div class="sec-head" style="margin-bottom:4px"><h3>Which assumptions matter most?</h3><div class="seg" id="tgt" style="margin:0"><button data-t="operating_income" aria-pressed="true">Operating income</button><button data-t="free_cash_flow" aria-pressed="false">Free cash flow</button></div></div><div id="torn"></div></div>
    </div>
    <p class="muted small">Method: revenue = prior revenue × (1 + growth); gross profit = revenue × gross margin; each opex line grows at its rate; operating income = gross profit − opex; net income = (operating income + other income) × (1 − tax rate); OCF = net income × OCF/NI; capex = revenue × capex %; FCF = OCF − capex. Other income is held at 0.</p>`;
  const cur={...S.assumptions}; let target="operating_income";
  function upd(){
    specs.forEach(([k])=>{ $("#v-"+k,el).textContent = k==="ocf_to_net_income"?cur[k].toFixed(2)+"x":fv(cur[k],"%"); });
    const b=runScenario(S.assumptions), s=runScenario(cur), d=k=>s[k]-b[k];
    const tile=(l,k,unit)=>{const dv=d(k); const cls=Math.abs(dv)<1e-6?"neu":dv>0?"good":"bad"; return `<div class="kpi"><div class="l">${l}</div><div class="v">${fv(s[k],unit)}</div><div class="c ${cls}">${unit==="%"?fv(dv,"pp"):signed(dv)} vs base case</div></div>`;};
    $("#outTiles",el).innerHTML=tile("Illustrative operating income","operating_income")+tile("Illustrative operating margin","operating_margin","%")+tile("Illustrative free cash flow","free_cash_flow");
    const rows=["revenue","gross_profit","research_and_development","sales_and_marketing","general_and_administrative","operating_income","net_income","operating_cash_flow","capital_expenditure","free_cash_flow"];
    $("#outTbl",el).innerHTML=`<table><thead><tr><th>Line</th><th class="n">Base case</th><th class="n">Scenario</th><th class="n">Δ</th><th class="n">Δ %</th></tr></thead><tbody>${rows.map(k=>`<tr><td>${k.replace(/_/g," ").replace(/^./,c=>c.toUpperCase())}</td><td class="n">${fv(b[k])}</td><td class="n">${fv(s[k])}</td><td class="n">${signed(d(k))}</td><td class="n">${pct(d(k)/Math.abs(b[k]))}</td></tr>`).join("")}</tbody></table>`;
    $("#torn",el).innerHTML=tornado(sensitivity(target));
  }
  el.addEventListener("input",e=>{ const i=e.target.closest("input[type=range]"); if(!i) return; cur[i.id.slice(3)]=parseFloat(i.value); upd(); });
  el.addEventListener("click",e=>{
    const p=e.target.closest("[data-p]"); if(p){ Object.assign(cur,S.assumptions); if(p.dataset.p==="rev") cur.revenue_growth-=.05; if(p.dataset.p==="gm") cur.gross_margin-=.02; if(p.dataset.p==="capex") cur.capex_intensity=.40;
      specs.forEach(([k])=>{ $("#sl-"+k,el).value=cur[k]; }); upd(); }
    const t=e.target.closest("#tgt button"); if(t){ target=t.dataset.t; el.querySelectorAll("#tgt button").forEach(b=>b.setAttribute("aria-pressed",b===t)); upd(); }
  });
  upd();
}

/* ---------- Evidence ---------- */
function renderEvidence(el){
  const st=Object.entries(DATA.statements).map(([name,s])=>`<div class="panel" style="margin-bottom:14px"><div class="pad" style="padding-bottom:4px"><h3>${esc(name)}</h3><div class="muted small">USD millions, except per-share amounts · Microsoft FY${M.fy} and FY${M.prior} Form 10-K</div></div><div class="tbl"><table><thead><tr><th>Line item</th>${s.years.map(y=>`<th class="n">FY${y}</th>`).join("")}</tr></thead><tbody>
    ${s.rows.map(r=>`<tr><td>${esc(r.label)}</td>${r.values.map(v=>`<td class="n">${v===null?'<span class="muted">—</span>':Math.abs(v)<100&&!Number.isInteger(v)?v.toFixed(2):Math.round(v).toLocaleString("en-US")}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`).join("");
  el.innerHTML=`<div class="sec-head"><h2>Evidence</h2><span class="muted small">Every number in the model with its provenance</span></div>
    <div class="panel" style="margin-bottom:14px"><div class="pad" style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between"><h3>Fact provenance</h3><input class="search" id="fq" placeholder="Filter by metric, segment, page, concept…" aria-label="Filter facts"></div>
      <div class="tbl scroll"><table><thead><tr><th>Period</th><th>Metric</th><th>Dimension</th><th class="n">Value</th><th>Unit</th><th>Document</th><th class="n">Page</th><th>Table · row · column</th><th>XBRL concept</th><th>Flags</th></tr></thead><tbody id="fb"></tbody></table></div></div>
    ${st}
    <div class="panel"><div class="pad" style="padding-bottom:4px"><h3>Source registry</h3></div><div class="tbl"><table><thead><tr><th>Document</th><th>Type</th><th>Period</th><th>Filed</th><th>Retrieved</th><th>Role</th><th>Link</th></tr></thead><tbody>
    ${DATA.sources.map(s=>`<tr><td>${esc(s.short_name)}</td><td>${esc(s.source_type)}</td><td>${esc(s.reporting_period)}</td><td class="mono">${esc(s.filing_date)}</td><td class="mono">${esc(s.retrieval_date)}</td><td>${esc(s.role)}</td><td><a href="${esc(s.source_url)}" target="_blank" rel="noopener">open ↗</a></td></tr>`).join("")}</tbody></table></div></div>`;
  const fb=$("#fb",el);
  function draw(q){ const t=q.toLowerCase(); const rows=DATA.facts.filter(f=>!t||Object.values(f).join(" ").toLowerCase().includes(t));
    fb.innerHTML=rows.slice(0,400).map(f=>`<tr><td class="mono">${esc(f.reporting_period)}</td><td>${esc(f.metric_label)}</td><td>${esc(f.dimension_label||"")}</td><td class="n">${Number(f.value).toLocaleString("en-US",{maximumFractionDigits:3})}</td><td class="small">${esc(f.unit)}</td><td class="small">${esc(f.source_document)}</td><td class="n">${esc(f.source_page)}</td><td class="small">${esc([f.source_table,f.row_label,f.column_label].filter(Boolean).join(" · "))}</td><td class="mono small">${esc((f.xbrl_concept||f.extraction_method||"").replace("us-gaap:",""))}</td><td class="small">${f.restated_vs_prior_filing?'<span class="tag bad">restated</span>':""}${f.consistency==="conflict"?'<span class="tag bad">conflict</span>':""}</td></tr>`).join("") || `<tr><td colspan="10" class="muted">No facts match “${esc(q)}”.</td></tr>`; }
  $("#fq",el).addEventListener("input",e=>draw(e.target.value)); draw("");
}

/* ---------- Governance ---------- */
function renderGovernance(el){
  const cats={}; DATA.checks.forEach(c=>{(cats[c.category]=cats[c.category]||[]).push(c);});
  el.innerHTML=`<div class="sec-head"><h2>AI governance</h2><span class="muted small">AI does not replace financial controls.</span></div>
  <div class="grid g2">
    <div class="panel pad"><h3>Model card</h3><div class="tbl"><table><tbody>
      ${[["Narrative model","Swappable provider (default Claude via the Anthropic SDK). This static edition shows the deterministic narrative"],["Prompt version",M.prompt_ref],["Calculation engine","Python, v"+M.engine+"; every result time-stamped"],["Structured data",M.facts+" facts extracted from Inline XBRL, SQLite"],["Retrieval","TF-IDF cosine over filing chunks, filtered by fiscal year and content type"],["Numeric guardrail","Every number in model prose must exist in the evidence pack; otherwise the deterministic narrative is used"],["Missing data","“I could not find sufficient evidence in the available public filings.”"],["Conflicting data","“The available sources contain differing values. The system requires manual review.”"],["Human authority","Decision support only; no automated actions"]].map(([k,v])=>`<tr><td class="muted" style="white-space:nowrap">${esc(k)}</td><td>${esc(v)}</td></tr>`).join("")}
    </tbody></table></div></div>
    <div class="panel pad"><h3>System prompt (versioned)</h3><div class="muted small" style="margin-bottom:6px">${esc(M.prompt_ref)}</div><pre class="prompt">${esc(DATA.prompt)}</pre></div>
  </div>
  <div class="panel pad" style="margin-top:14px"><h3>Audit log</h3><div class="muted small" style="margin-bottom:8px">User question → intent and metrics selected → retrieved sources → calculations → validation → final answer (SHA-256). Recorded while generating this page.</div>
    <div class="tbl"><table><thead><tr><th>Time (UTC)</th><th>Question</th><th>Intent</th><th>Confidence</th><th>Steps</th></tr></thead><tbody>
    ${DATA.audit.map((a,i)=>`<tr><td class="mono small" style="white-space:nowrap">${esc(a.timestamp.replace("T"," ").slice(0,19))}</td><td>${esc(a.question)}<details class="steps" style="border:0"><summary style="padding:4px 0">Show ${a.steps.length} steps · answer ${esc((a.sha||"").slice(0,12))}…</summary><div class="steps">${a.steps.map(s=>`<details><summary>${esc(s.step)}</summary><div class="inner"><pre>${esc(JSON.stringify(Object.fromEntries(Object.entries(s).filter(([k])=>k!=="step")),null,1))}</pre></div></details>`).join("")}</div></details></td><td class="mono small">${esc(a.intent)}</td><td>${esc(a.confidence)}</td><td class="n">${a.steps.length}</td></tr>`).join("")}
    </tbody></table></div></div>
  <div class="grid g2" style="margin-top:14px">
    <div class="panel pad"><h3>Data quality · ${M.dq_passed}/${M.dq_total} checks pass</h3><div class="tbl scroll" style="max-height:420px"><table><thead><tr><th>Category</th><th>Check</th><th class="n">FY</th><th>Result</th></tr></thead><tbody>
      ${DATA.checks.map(c=>`<tr><td class="small">${esc(c.category)}</td><td class="small">${esc(c.name)}</td><td class="n">${c.fy||""}</td><td class="${c.passed?"good":"bad"}">${c.passed?"✓ pass":"✗ fail"}</td></tr>`).join("")}
    </tbody></table></div></div>
    <div class="panel pad"><h3>Restatements &amp; conflicts for human review</h3><div class="muted small" style="margin-bottom:6px">Detected automatically by comparing the FY${M.fy} and FY${M.prior} filings.</div><div class="tbl"><table><thead><tr><th>Type</th><th>Fact</th><th class="n">Used</th><th class="n">Other</th><th>Resolution</th></tr></thead><tbody>
      ${DATA.conflicts.map(c=>`<tr><td class="small">${esc(String(c.conflict_type).replace(/_/g," "))}</td><td class="mono small">${esc(c.fact_key)}</td><td class="n">${c.value_used===null?"—":Number(c.value_used).toLocaleString("en-US")}</td><td class="n">${Number(c.other_value).toLocaleString("en-US")}</td><td class="small">${esc(c.resolution)}</td></tr>`).join("")}
    </tbody></table></div></div>
  </div>`;
}

const RENDER={brief:renderBrief,copilot:renderCopilot,variance:renderVariance,trees:renderTrees,scenario:renderScenario,evidence:renderEvidence,governance:renderGovernance};
let start = (location.hash||"").slice(1);
if(!RENDER[start]){ try{ start = localStorage.getItem("cfo-tab"); }catch(e){ start=null; } }
show(RENDER[start] ? start : "brief");
})();
</script>
